, {"cell": "D29", "text": "提升祝福技能等级，提供关联勇士单项属性成长率加成。", "sheet": "1.1潜能系统规则", "original": "提升命格技能等级提供属性百分比加成"}, {"cell": "D30", "text": "提升命格技能等级，提供关联勇士全属性成长率加成。", "sheet": "1.1潜能系统规则", "original": "提升命格技能等级提供全属性加成"}, {"cell": "D71", "text": "天命技能提供关联勇士单项属性百分比加成，祝福技能提供单项属性成长率加成，命格技能提供全属性成长率加成。", "sheet": "1.1潜能系统规则", "original": "天命技能提供属性百分比加成，祝福技能提供属性成长率加成，命格技能提供全属性成长率加成"}]}], "actionNote": "仅此条集中维护技能效果方案；B29的名称复制错误已另列必改。", "originals": [{"sheet": "4.1文案需求", "cell": "E59", "text": "消耗对应妃子的天命石强化，提高该妃子对应属性的百分比加成。"}, {"sheet": "4.1文案需求", "cell": "E60", "text": "消耗祝福石强化，提高妃子的对应属性成长率。"}, {"sheet": "1.1潜能系统规则", "cell": "D28", "text": "提升命格技能等级提供属性成长率加成"}, {"sheet": "1.1潜能系统规则", "cell": "D29", "text": "提升命格技能等级提供属性百分比加成"}, {"sheet": "1.1潜能系统规则", "cell": "D30", "text": "提升命格技能等级提供全属性加成"}, {"sheet": "1.1潜能系统规则", "cell": "D71", "text": "天命技能提供属性百分比加成，祝福技能提供属性成长率加成，命格技能提供全属性成长率加成"}]}, {"id": "astra-33", "kind": "ambiguity", "scope": "story", "group": "引导配置", "title": "“本期投放妃子”需明确具体配置对象", "sheet": "4.1文案需求", "location": "F82、F84、F86", "original": "F82：本期投放妃子\nF84：本期投放妃子\nF86：本期投放妃子", "proposal": "通用剧情稿可使用“本期投放妃子”作为角色占位说明；正式配置前，需明确本期实际使用的妃子名称、角色ID及对应立绘资源。\nF82、F84、F86统一绑定同一位指定妃子。若剧情随每期促销复用，应由每期投放配置明确绑定；若仅用于系统首次引导，应明确固定出演妃子。\n可汗台词继续使用玩家角色配置，G81、G88按旁白配置，不归入妃子对白。", "reason": "“本期投放妃子”只说明角色选取方向，没有指明可直接落表的具体对象。明确具体角色及绑定方式，才能统一配置发言人、立绘和展示名称，避免配置人员自行猜测，也便于后续各期复用。", "check": "需系统／文案确认实际出演妃子，以及固定出演还是按每期投放绑定；角色ID沿用项目正式配置，不在评审中自行编造。", "highlights": [], "handling": true, "priority": "确认后修改", "usage": "剧情展示", "replacements": []}], "drafts": [{"id": "intro", "title": "活动介绍", "audience": "玩家展示", "sheet": "4.1文案需求", "location": "D49", "original": "苍穹之上，群星交织成命。每一颗天命星，都蕴藏着不同的天赋与潜能。点亮星辰、连缀星轨，即可唤醒妃子的命格之力；点亮星石，还能为与她关联的勇士带来庇佑。当妃子相聚、华服生辉，圣命星也将愈发璀璨，为天命星赋予更强的祝福。", "text": "群星闪耀，珍藏的星图正等待被唤醒。与妃子一同探寻星辰中的力量，逐步点亮星图，让她的天赋化作关联勇士的助力。当星石绽放光芒，更强的力量也将随之苏醒。星缘相连的妃子们，还将在各自的成长中彼此辉映，让圣命星的祝福愈加强盛。今夜，便与她共赴这场追寻星光的旅程。", "reason": "减少概念堆叠，突出星辰探索、相伴成长与勇士受益。", "scope": "interface"}, {"id": "core", "title": "核心体验", "audience": "内部评审", "sheet": "4.1文案需求", "location": "H49", "original": "逐步点亮星图，培养妃子的天赋；以星石增强关联勇士，并开启下一颗天命星的养成。通过妃子收集、套系升星和华服培养，推动圣命星升级。", "text": "玩家为选定妃子消耗天命石和祝福石，逐级培养天命星中的技能，持续提升关联勇士属性。当前阶段技能全部满级后，可点亮星石，获得额外加成并解锁下一阶段，形成“技能升级—星石突破—下一阶段”的成长节奏。\n\n套系内妃子的收集、升星或皮肤培养达到对应条件后，可升级圣命星，放大本套系的天命星加成。玩家根据关联勇士的培养需求，选择优先投入的妃子与套系。", "reason": "按操作、收益和下一步目标描述功能，不将非主力妃子培养写成已达成效果。", "scope": "direction"}], "story": [{"location": "G81", "speaker": "旁白", "text": "夜色笼罩草原，王帐中却仍亮着灯火。你循着灯光走近，只见妃子正将一幅星图铺在桌上，图角还压着几颗晶莹的石头。", "changed": false, "original": "夜色笼罩草原，王帐中却仍亮着灯火。你循着灯光走近，只见妃子正将一幅星图铺在桌上，图角还压着几颗晶莹的石头。", "originalSpeaker": "旁白", "reviewIds": [], "contextNote": ""}, {"location": "G82", "speaker": "本期投放妃子", "text": "可汗，您来得正好！听说群星藏着人们尚未发现的力量。我找了好久，终于寻到了这幅星图。", "changed": true, "original": "可汗，您来得正好！小时候，祖母总指着星空说，每个人都有属于自己的天命星。我找了好久，终于寻到了这幅星图。", "originalSpeaker": "本期投放妃子", "reviewIds": ["astra-25"], "contextNote": "后接可汗询问“找到自己的那颗星了吗”；“寻到星图”与“尚未找到星辰”仍能衔接。"}, {"location": "G83", "speaker": "{可汗昵称}", "text": "难怪这几晚都见你望着天上。怎么样，找到自己的那颗星了吗？", "changed": false, "original": "难怪这几晚都见你望着天上。怎么样，找到自己的那颗星了吗？", "originalSpeaker": "{可汗昵称}", "reviewIds": [], "contextNote": ""}, {"location": "G84", "speaker": "本期投放妃子", "text": "还没有呢。图上说，要沿着星轨慢慢唤醒其中的力量，直到星石亮起。可这漫天的星星，我一个人恐怕要找上许久……您愿意陪我吗？", "changed": true, "original": "还没有呢。不过据说，沿着星图找到自己的天命星，就能唤醒相应的星石，得到星辰的庇佑。您愿意陪我一起找吗？", "originalSpeaker": "本期投放妃子", "reviewIds": ["astra-26"], "contextNote": "回应上一句“找到了吗”，再邀请可汗陪伴；下一句“当然”能够自然接住邀请。"}, {"location": "G85", "speaker": "{可汗昵称}", "text": "当然。不过，这些彼此相连的星辰，又有什么特别之处？", "changed": true, "original": "当然。只是这图上，有些星辰连在一起，又都围着一颗大星，这是为什么？", "originalSpeaker": "{可汗昵称}", "reviewIds": ["astra-27"], "contextNote": "先答应陪伴，再提问星缘，为下一句解释保留明确话题。"}, {"location": "G86", "speaker": "本期投放妃子", "text": "那是星缘。星轨相连的人，各自的成长都能让圣命星更加明亮，再由它辉映彼此的天命星。就像有人相伴，前面的路也会亮一些。", "changed": true, "original": "那便是“星缘”，就像因缘相聚的姐妹们。中央的是圣命星，祖母说，相伴的人越是同心，它的光芒就越明亮，照看着彼此的天命星。", "originalSpeaker": "本期投放妃子", "reviewIds": ["astra-28"], "contextNote": "用星缘回应上一句，保留相伴意象，承接可汗下一句邀请大家一同观星。"}, {"location": "G87", "speaker": "{可汗昵称}", "text": "那明晚便邀大家一起来。今夜，先让我陪你找找——总不能让你的那颗星等得太久。", "changed": false, "original": "那明晚便邀大家一起来。今夜，先让我陪你找找——总不能让你的那颗星等得太久。", "originalSpeaker": "{可汗昵称}", "reviewIds": [], "contextNote": ""}, {"location": "G88", "speaker": "旁白", "text": "她笑着挪开身旁的软垫，为你让出位置。帐外群星闪烁，桌上的星石也悄然映出一缕微光。", "changed": true, "original": "她笑着挪开身旁的软垫，为你让出位置。帐外群星闪烁，桌上的星石也悄然映出一缕微光。", "originalSpeaker": "本期投放妃子", "reviewIds": ["astra-29"], "contextNote": "承接可汗的陪伴承诺，以让座和星石微光收尾；由旁白承担动作，不让角色朗读自己的动作。"}], "storyConservative": [{"location": "G81", "speaker": "旁白", "text": "夜色笼罩草原，王帐中却仍亮着灯火。你循着灯光走近，只见妃子正将一幅星图铺在桌上，图角还压着几颗晶莹的石头。"}, {"location": "G82", "speaker": "本期投放妃子", "text": "可汗，您来得正好！小时候，祖母总指着星空说，每个人都有属于自己的天命星。我找了好久，终于寻到了这幅星图。"}, {"location": "G83", "speaker": "{可汗昵称}", "text": "难怪这几晚都见你望着天上。怎么样，找到自己的那颗星了吗？"}, {"location": "G84", "speaker": "本期投放妃子", "text": "还没有呢。不过据说，沿着星图找到自己的天命星，就能唤醒相应的星石，得到星辰的庇佑。您愿意陪我一起找吗？"}, {"location": "G85", "speaker": "{可汗昵称}", "text": "当然。只是这图上，有些星辰连在一起，又都围着一颗大星，这是为什么？"}, {"location": "G86", "speaker": "本期投放妃子", "text": "那便是“星缘”，就像因缘相聚的姐妹们。中央的是圣命星，祖母说，相伴的人越是同心，它的光芒就越明亮，照看着彼此的天命星。"}, {"location": "G87", "speaker": "{可汗昵称}", "text": "那明晚便邀大家一起来。今夜，先让我陪你找找——总不能让你的那颗星等得太久。"}, {"location": "G88", "speaker": "旁白", "text": "她笑着挪开身旁的软垫，为你让出位置。帐外群星闪烁，桌上的星石也悄然映出一缕微光。"}], "storyConservativeNote": "仅将G88的发言样式与角色修正为旁白；可选对白保留原文。具体出演妃子和播放时机仍需确认。", "storyPolishNote": "采用可选对白调整，仅作润色参考；未经评审采用，不作为默认配置稿。"}, {"id": "consort-ranking", "name": "妃子冲榜", "type": "活动", "version": "文案评审", "updated": "2026-10-24", "source": "GOK 妃子促销最强冲榜.xlsx", "summary": "王庭盛典主题下的四轮竞榜、妃子培养与闪卡收集。", "note": "仅评审文案包装；规则未定处列为待确认，建议尚未写回工作簿。", "items": [{"id": "ranking-01", "scope": "direction", "group": "主题命名", "title": "活动总名与子玩法名分层", "sheet": "文案包装", "location": "B49、B64", "original": "B49：王庭盛典\nB64：春游闲趣", "originals": [{"sheet": "文案包装", "cell": "B49", "text": "王庭盛典"}, {"sheet": "文案包装", "cell": "B64", "text": "春游闲趣"}], "proposal": "王庭盛典\n\n春游闲趣", "reason": "总名需要同时容纳四轮竞榜、妃子培养、串联玩法和闪 function ordered(items){return [...items].sort((a,b)=>a.sheet.localeCompare(b.sheet,'zh-CN')||rowNum(a)-rowNum(b))}
function scopeItems(p){return(p?.items||[]).filter(i=>i.scope===tab)}
function matches(i){const q=query.trim().toLowerCase();return(kind==='all'||i.kind===kind)&&(!q||[i.title,i.sheet,i.location,i.original,i.proposal,i.reason,i.check,i.group,i.actionNote,i.priority,i.usage,JSON.stringify(i.replacements||[]),JSON.stringify(i.alternatives||[])].join(' ').toLowerCase().includes(q))}
function highlighted(i){
 if(i.kind!=='error')return esc(i.original);
 return i.original.split('\n').map(line=>{
  let words=i.highlights||[];
  if(i.id==='astra-24')words=/^[KO]987/.test(line)?['图腾加成']:['图腾加成','#n1#'];
  if(i.id==='astra-31')words=line.startsWith('D30')?[]:words;
  const terms=[...new Set(words)].filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!terms.length)return esc(line);
  const re=new RegExp(terms.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  let out='',at=0;for(const m of line.matchAll(re)){out+=esc(line.slice(at,m.index))+'<mark class="error-word">'+esc(m[0])+'</mark>';at=m.index+m[0].length}return out+esc(line.slice(at));
 }).join('\n');
}
function render(){const p=project();$('projectName').textContent=p?.name||'文案包装校对';document.title=(p?.name?p.name+' · ':'')+'GOK文案包装校对';document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});$('reviewPanel').classList.remove('hidden');$('draftsPanel').classList.add('hidden');$('storyPanel').classList.toggle('hidden',tab!=='story');renderReviews(p);renderStory(p)}


function replacementBlocks(i){
 const block=(r,index,alt)=>{
  const attrs=`data-copy-replacement="${esc(i.id)}" data-replacement-index="${index}" ${alt===undefined?'':`data-alternative-index="${alt}"`}`;
  const cross=r.sheet&&r.sheet!==i.sheet;
  return `<div class="replacement"><div class="replacement-head"><span>${cross?`<small class="replacement-sheet">${esc(r.sheet)}</small>`:''}<span class="cell">${esc(r.cell)}</span></span><button class="copy" ${attrs}>复制此单元格</button></div><div class="copytext">${esc(r.text)}</div>${r.shortText?`<details class="short-option"><summary>空间受限时的精简稿</summary><p>${esc(r.shortCondition)}</p><div class="copytext">${esc(r.shortText)}</div><button class="copy" ${attrs} data-short="true">复制精简稿</button></details>`:''}</div>`;
 };
 let out=(i.replacements||[]).map((r,index)=>block(r,index)).join('');
 if(i.alternatives?.length)out+=`<div class="conditional-title">由系统确认规则后，统一采用一套文本</div>`+i.alternatives.map((a,ai)=>`<details class="alternative"><summary>${esc(a.title)}</summary><p class="condition">${esc(a.condition)}</p>${a.replacements.map((r,ri)=>block(r,ri,ai)).join('')}</details>`).join('');
 if(!out)out=`<div class="copytext">${esc(i.proposal)}</div>`;
 return out;
}
function priorityBadge(value){return `<span class="action-priority ${value==='必改'?'required':value==='确认后修改'?'confirm':'optional'}">${esc(value||'可选')}</span>`}
function card(i){
 const hasCells=i.replacements?.length||i.alternatives?.length;
 return `<article class="review ${esc(i.kind)}"><div class="cardhead"><div><div class="titleline"><span class="badge">${labels[i.kind]}</span><h3>${esc(i.title)}</h3>${priorityBadge(i.priority)}</div><div class="loc">${esc(i.sheet)}<span class="cell">${esc(i.location)}</span><span class="usage">适用：${esc(i.usage||'内部设计说明')}</span></div></div>${hasCells?'':`<button class="copy" data-copy-item="${esc(i.id)}">复制处理方案</button>`}</div><div class="comparison"><div class="col original"><div class="label">原文</div><div class="copytext">${highlighted(i)}</div></div><div class="col proposal"><div class="label">${i.handling&&!hasCells?'处理方案':'建议文本'}</div>${replacementBlocks(i)}${i.lengthNote?`<div class="length-note">${esc(i.lengthNote)}</div>`:''}</div></div><div class="reason"><strong>修改理由</strong>${esc(i.reason)}${i.actionNote?`<div class="actionnote">${esc(i.actionNote)}</div>`:''}</div>${i.check?`<div class="pending"><b>待确认</b>　${esc(i.check)}</div>`:''}</article>`
}
function renderReviews(p){
 const all=scopeItems(p);
 const categories=[['all','全部'],...Object.entries(labels)].filter(([k])=>k==='all'?all.length>0:all.some(i=>i.kind===k));
 if(kind!=='all'&&!categories.some(([k])=>k===kind))kind='all';
 const rows=all.filter(matches);
 $('filters').innerHTML=categories.map(([k,l])=>`<button class="chip ${kind===k?'active':''}" data-kind="${k}" aria-pressed="${kind===k}">${l}<span class="count">${k==='all'?all.length:all.filter(i=>i.kind===k).length}</span></button>`).join('');
 $('resultCount').textContent=`${rows.length} / ${all.length} 条建议`;
 const cards=tab==='story'?rows.filter(i=>i.group==='引导配置'):rows;
 const names=[...new Set([...(groups[tab]||[]),...cards.map(i=>i.group)])];
 $('cards').innerHTML=names.map(name=>{const items=ordered(cards.filter(i=>i.group===name));return items.length?`<section aria-label="${esc(name)}"><h2 class="grouphead">${esc(name)}<small>${items.length} 条</small></h2>${items.map(card).join('')}</section>`:''}).join('');
 if(!rows.length)$('cards').innerHTML='<div class="empty"><strong>没有匹配的建议</strong>试试其他关键词或问题类别。</div>';
}
function narrativeIssue(p,line){return(p?.items||[]).filter(i=>(line.reviewIds||[]).includes(i.id))}
function visibleStory(p,line){
 const issues=narrativeIssue(p,line);
 if(kind==='all'&&!query.trim())return true;
 if(issues.some(matches))return true;
 if(kind!=='all'&&!issues.some(i=>i.kind===kind))return false;
 const q=query.trim().toLowerCase();return Boolean(q)&&[line.location,line.speaker,line.originalSpeaker,line.original,line.text].join(' ').toLowerCase().includes(q);
}
function renderStory(p){
 if(tab!=='story'){ $('storyPanel').innerHTML='';return }
 const story=p?.story||[],rows=story.filter(s=>visibleStory(p,s));
 if(!story.length){$('storyPanel').innerHTML='';return}
 const body=rows.map(s=>{
  const issues=narrativeIssue(p,s);const severity=issues.some(i=>i.kind==='error')?'error':issues.some(i=>i.kind==='ambiguity')?'ambiguity':'polish';
  const role=s.originalSpeaker!==s.speaker?`<mark class="error-word">${esc(s.originalSpeaker)}</mark>`:esc(s.originalSpeaker);
  return `<div class="narrative-line ${severity}"><div class="line-meta"><span class="cell">${esc(s.location)}</span>${issues.length?`<span class="badge">${labels[severity]}</span>${priorityBadge(issues.some(i=>i.priority==='必改')?'必改':issues.some(i=>i.priority==='确认后修改')?'确认后修改':'可选')}`:'<span class="unchanged">保留</span>'}</div><div class="line-source"><div class="line-title">原文</div><div class="line-role">${role}</div>${esc(s.original)}</div><div class="line-proposal"><div class="line-title">建议稿</div><div class="line-role">${esc(s.speaker)}</div>${esc(s.text)}${s.changed?`<button class="copy" data-copy-line="${esc(s.location)}">复制建议句</button>`:''}</div>${issues.length?`<div class="line-reason"><b>修改理由：</b>${issues.map(i=>esc(i.reason)+(i.check?`<br><b>待确认：</b>${esc(i.check)}`:'')).join('<br>')}${s.contextNote?`<div class="context-note"><b>衔接检查：</b>${esc(s.contextNote)}</div>`:''}</div>`:''}</div>`;
 }).join('');
 $('storyPanel').innerHTML=(rows.length?`<div class="story-heading"><h2>剧情逐句对照<small>${rows.length} 句</small></h2><button class="copy" id="copyStory">复制保守修正版</button></div><div class="narrative"><div class="narrative-head"><span>位置</span><span>原文 / 发言角色</span><span>建议稿 / 发言角色</span></div>${body}</div>`:'')+`<details class="draft"><summary>保守修正版 · 仅修必改项</summary><p class="rationale">${esc(p.storyConservativeNote||'仅修正明确错误，保留可选对白原文。')}</p><div class="finaltext">${(p.storyConservative||story).map(s=>esc(s.speaker)+'：'+esc(s.text)).join('\n\n')}</div></details><details class="draft"><summary>润色参考版 · 包含可选调整</summary><p class="rationale">${esc(p.storyPolishNote||'仅作润色参考，非默认定稿。')}</p><button class="copy" id="copyStoryPolish">复制润色参考版</button><div class="finaltext">${story.map(s=>esc(s.speaker)+'：'+esc(s.text)).join('\n\n')}</div></details>`;
}
$('projectSelect').innerHTML=projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.type)}</option>`).join('');
$('projectSelect').addEventListener('change',e=>{activeId=e.target.value;query='';$('search').value='';kind='all';render()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;kind='all';query='';$('search').value='';render()}});
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(b){kind=b.dataset.kind;renderReviews(project());renderStory(project())}});
$('search').addEventListener('input',e=>{query=e.target.value;renderReviews(project());renderStory(project())});
$('cards').addEventListener('click',e=>{
 const cellButton=e.target.closest('[data-copy-replacement]');
 if(cellButton){const i=project()?.items.find(x=>x.id===cellButton.dataset.copyReplacement);const ai=cellButton.dataset.alternativeIndex;const list=ai===undefined?i?.replacements:i?.alternatives?.[Number(ai)]?.replacements;const r=list?.[Number(cellButton.dataset.replacementIndex)];if(r)copy(cellButton.dataset.short?r.shortText:r.text);return}
 const b=e.target.closest('[data-copy-item]');if(b){const i=project()?.items.find(x=>x.id===b.dataset.copyItem);if(i)copy(i.proposal)}
});
$('storyPanel').addEventListener('click',e=>{if(e.target.closest('#copyStory'))copy((project().storyConservative||project().story).map(s=>s.speaker+'：'+s.text).join('\n\n'));if(e.target.closest('#copyStoryPolish'))copy(project().story.map(s=>s.speaker+'：'+s.text).join('\n\n'));const b=e.target.closest('[data-copy-line]');if(b){const line=project()?.story.find(s=>s.location===b.dataset.copyLine);if(line)copy(line.text)}});
render();
</script>
</body></html>
