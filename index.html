direction"}],"story":[{"location":"G81","speaker":"旁白","text":"夜色笼罩草原，王帐中却仍亮着灯火。你循着灯光走近，只见妃子正将一幅星图铺在桌上，图角还压着几颗晶莹的石头。","changed":false,"original":"夜色笼罩草原，王帐中却仍亮着灯火。你循着灯光走近，只见妃子正将一幅星图铺在桌上，图角还压着几颗晶莹的石头。","originalSpeaker":"旁白","reviewIds":[],"contextNote":""},{"location":"G82","speaker":"本期投放妃子","text":"可汗，您来得正好！听说群星藏着人们尚未发现的力量。我找了好久，终于寻到了这幅星图。","changed":true,"original":"可汗，您来得正好！小时候，祖母总指着星空说，每个人都有属于自己的天命星。我找了好久，终于寻到了这幅星图。","originalSpeaker":"本期投放妃子","reviewIds":["astra-25"],"contextNote":"后接可汗询问“找到自己的那颗星了吗”；“寻到星图”与“尚未找到星辰”仍能衔接。"},{"location":"G83","speaker":"{可汗昵称}","text":"难怪这几晚都见你望着天上。怎么样，找到自己的那颗星了吗？","changed":false,"original":"难怪这几晚都见你望着天上。怎么样，找到自己的那颗星了吗？","originalSpeaker":"{可汗昵称}","reviewIds":[],"contextNote":""},{"location":"G84","speaker":"本期投放妃子","text":"还没有呢。图上说，要沿着星轨慢慢唤醒其中的力量，直到星石亮起。可这漫天的星星，我一个人恐怕要找上许久……您愿意陪我吗？","changed":true,"original":"还没有呢。不过据说，沿着星图找到自己的天命星，就能唤醒相应的星石，得到星辰的庇佑。您愿意陪我一起找吗？","originalSpeaker":"本期投放妃子","reviewIds":["astra-26"],"contextNote":"回应上一句“找到了吗”，再邀请可汗陪伴；下一句“当然”能够自然接住邀请。"},{"location":"G85","speaker":"{可汗昵称}","text":"当然。不过，这些彼此相连的星辰，又有什么特别之处？","changed":true,"original":"当然。只是这图上，有些星辰连在一起，又都围着一颗大星，这是为什么？","originalSpeaker":"{可汗昵称}","reviewIds":["astra-27"],"contextNote":"先答应陪伴，再提问星缘，为下一句解释保留明确话题。"},{"location":"G86","speaker":"本期投放妃子","text":"那是星缘。星轨相连的人，各自的成长都能让圣命星更加明亮，再由它辉映彼此的天命星。就像有人相伴，前面的路也会亮一些。","changed":true,"original":"那便是“星缘”，就像因缘相聚的姐妹们。中央的是圣命星，祖母说，相伴的人越是同心，它的光芒就越明亮，照看着彼此的天命星。","originalSpeaker":"本期投放妃子","reviewIds":["astra-28"],"contextNote":"用星缘回应上一句，保留相伴意象，承接可汗下一句邀请大家一同观星。"},{"location":"G87","speaker":"{可汗昵称}","text":"那明晚便邀大家一起来。今夜，先让我陪你找找——总不能让你的那颗星等得太久。","changed":false,"original":"那明晚便邀大家一起来。今夜，先让我陪你找找——总不能让你的那颗星等得太久。","originalSpeaker":"{可汗昵称}","reviewIds":[],"contextNote":""},{"location":"G88","speaker":"旁白","text":"她笑着挪开身旁的软垫，为你让出位置。帐外群星闪烁，桌上的星石也悄然映出一缕微光。","changed":true,"original":"她笑着挪开身旁的软垫，为你让出位置。帐外群星闪烁，桌上的星石也悄然映出一缕微光。","originalSpeaker":"本期投放妃子","reviewIds":["astra-29"],"contextNote":"承接可汗的陪伴承诺，以让座和星石微光收尾；由旁白承担动 231、G234、G235、F237","original":"G226：玩家连续消耗#N#个【闲趣令】，必出1个闪卡碎片\nG227：触发保底后，重置保底次数\nG230：玩家连续消耗#N#个【闲趣令】且均未获得【UP】品质闪卡碎片，则下一次必出1个【UP】品质闪卡碎片\nG231：触发保底后，重置保底次数\nG234：对应轮次地图内，玩家累计每消耗#N#个【闲趣令】，保底从该轮次奖池内随机获得一个未拥有的闪卡碎片\nG235：触发保底后，重置保底次数\nF237：若同时触发【闪卡碎片品质保底】和【全图鉴保底】，则按照【全图鉴保底】优先级＞【闪卡碎片品质保底】判断","originals":[{"sheet":"系统规则","cell":"G226","text":"玩家连续消耗#N#个【闲趣令】，必出1个闪卡碎片"},{"sheet":"系统规则","cell":"G227","text":"触发保底后，重置保底次数"},{"sheet":"系统规则","cell":"G230","text":"玩家连续消耗#N#个【闲趣令】且均未获得【UP】品质闪卡碎片，则下一次必出1个【UP】品质闪卡碎片"},{"sheet":"系统规则","cell":"G231","text":"触发保底后，重置保底次数"},{"sheet":"系统规则","cell":"G234","text":"对应轮次地图内，玩家累计每消耗#N#个【闲趣令】，保底从该轮次奖池内随机获得一个未拥有的闪卡碎片"},{"sheet":"系统规则","cell":"G235","text":"触发保底后，重置保底次数"},{"sheet":"系统规则","cell":"F237","text":"若同时触发【闪卡碎片品质保底】和【全图鉴保底】，则按照【全图鉴保底】优先级＞【闪卡碎片品质保底】判断"}],"proposal":"补全三种保底的触发次数与计数重置条件：\n普通碎片保底：明确N次内必得，或连续N次未获得后的下一次必得。\nUP碎片保底：明确随机获得UP碎片是否重置计数。\n同时触发：明确优先发放未拥有的非UP碎片后，UP保底是否保留及对应计数处理。\n确认后同步玩家规则说明。","reason":"普通碎片保底的触发次数、随机获得UP碎片后的计数处理，以及同时触发两种保底后的处理规则尚未完整定义，影响玩家对保底所需次数的判断。","check":"系统策划确认表列规则，并补充各奖池保底计数是否独立、切换奖池是否保留进度。","kind":"ambiguity","priority":"确认后修改","usage":"先确认规则，再补帮助说明","highlights":[],"replacements":[],"handling":true,"actionNote":"","analysis":{"summary":"三种保底已定义，但触发次数与计数重置条件仍需补全。","headers":["规则位置","待明确内容","修改要求"],"rows":[["普通碎片保底 G226","“连续消耗N个，必出碎片”未明确第N次与第N＋1次的触发关系。","明确保证在N次内获得，或连续N次未获得后下一次必得。"],["UP碎片保底 G230、G231","已规定触发保底后重置，未说明提前随机获得UP碎片是否重置计数。","补充随机获得UP碎片时的计数处理。"],["保底优先级 F237","已规定未拥有碎片保底优先，未说明本次发放非UP碎片后UP保底的处理。","明确UP保底是否保留至后续抽取，以及对应计数是否重置。"]],"caption":"","recommendation":"系统策划确认后，分别补齐普通碎片保底、UP碎片保底和未拥有碎片保底的触发条件、奖励及重置条件，再同步玩家规则说明。"}},{"id":"ranking-20","scope":"story","group":"引导配置","title":"剧情出演妃子需明确配置对象","sheet":"文案包装","location":"F87、F89、F91","original":"F87：本期投放妃子\nF89：本期投放妃子\nF91：本期投放妃子","originals":[{"sheet":"文案包装","cell":"F87","text":"本期投放妃子"},{"sheet":"文案包装","cell":"F89","text":"本期投放妃子"},{"sheet":"文案包装","cell":"F91","text":"本期投放妃子"}],"proposal":"前提：本期已确认新增剧情播放功能并纳入开发排期。\nF87、F89、F91统一绑定同一位本期指定妃子。正式配置前由每期 <script>'use strict';
const base=JSON.parse(document.getElementById('review-data').textContent);
const labels={error:'明确错误',ambiguity:'概念歧义',polish:'表达优化'};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const projects=base.projects;
const route=new URLSearchParams(location.hash.slice(1));
let activeId=projects.some(p=>p.id===route.get('project'))?route.get('project'):projects[0]?.id,kind='all',tab=['interface','direction','story'].includes(route.get('tab'))?route.get('tab'):'interface',query='';
function saveRoute(){const params=new URLSearchParams();params.set('project',activeId);params.set('tab',tab);history.replaceState(null,'',location.pathname+location.search+'#'+params.toString())}
function resetView(){query='';$('search').value='';kind='all';render();saveRoute();window.scrollTo({top:0,behavior:'instant'})}

const groups={interface:['介绍与说明','培养操作','属性与术语','需系统确认'],direction:['主题命名','概念关系','核心体验'],story:['引导配置','剧情引导']};
function project(){return projects.find(p=>p.id===activeId)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),2200)}
async function copy(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const el=document.createElement('textarea');el.value=text;el.style.position='fixed';el.style.left='-10000px';document.body.append(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw Error('copy')}toast('已复制')}catch(e){toast('复制受限，请选中文本手动复制')}}
function rowNum(i){return Math.min(...(i.location.match(/\d+/g)||['0']).map(Number))}
function ordered(items){return [...items].sort((a,b)=>a.sheet.localeCompare(b.sheet,'zh-CN')||rowNum(a)-rowNum(b))}
function scopeItems(p){return(p?.items||[]).filter(i=>i.scope===tab)}
function matches(i){const q=query.trim().toLowerCase();return(kind==='all'||i.kind===kind)&&(!q||[i.title,i.sheet,i.location,i.original,i.proposal,i.reason,i.check,i.group,i.actionNote,i.priority,i.usage,JSON.stringify(i.replacements||[]),JSON.stringify(i.alternatives||[]),JSON.stringify(i.additions||[]),JSON.stringify(i.conceptTable||{})].join(' ').toLowerCase().includes(q))}

const diffCache=new Map();
function diffText(before,after){
 const key=JSON.stringify([before,after]);if(diffCache.has(key))return diffCache.get(key);
 const a=String(before??'').match(/#[^#\n]+#|[\s\S]/gu)||[],b=String(after??'').match(/#[^#\n]+#|[\s\S]/gu)||[];
 let left='',right='';
 const wrap=(s,type)=>s?'<mark class="diff-'+type+'">'+esc(s)+'</mark>':'';
 if(a.length*b.length>8000000){left=wrap(before,'removed');right=wrap(after,'added')}
 else{
  const cols=b.length+1,dp=new Uint16Array((a.length+1)*cols);
  for(let x=a.length-1;x>=0;x--)for(let y=b.length-1;y>=0;y--)dp[x*cols+y]=a[x]===b[y]?1+dp[(x+1)*cols+y+1]:Math.max(dp[(x+1)*cols+y],dp[x*cols+y+1]);
  let x=0,y=0,removed='',added='';
  const flush=()=>{left+=wrap(removed,'removed');right+=wrap(added,'added');removed='';added=''};
  while(x<a.length||y<b.length){
   if(x<a.length&&y<b.length&&a[x]===b[y]){flush();left+=esc(a[x]);right+=esc(b[y]);x++;y++}
   else if(x<a.length&&(y===b.length||dp[(x+1)*cols+y]>=dp[x*cols+y+1]))removed+=a[x++];
   else added+=b[y++];
  }flush();
 }
 const result={before:left,after:right};if(diffCache.size>100)diffCache.clear();diffCache.set(key,result);return result;
}
function diffOriginal(i){
 if(i.replacements?.length)return i.replacements.map(r=>'<div class="replacement-head"><span class="cell">'+esc(r.cell)+'</span></div><div class="copytext">'+diffText(r.original,r.text).before+'</div>').join('');
 return diffText(i.originals?.length===1?i.originals[0].text:i.original,i.proposal).before;
}

function highlighted(i){
 if(i.showDiff)return diffOriginal(i);
 if(i.kind!=='error')return esc(i.original);
 return i.original.split('\n').map(line=>{
  let words=i.highlights||[];
  if(i.id==='astra-24')words=/^[KO]987/.test(line)?['图腾加成']:['图腾加成','#n1#'];
  if(i.id==='astra-31')words=line.startsWith('D30')?[]:words;
  const terms=[...new Set(words)].filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!terms.length)return esc(line);
  const re=new RegExp(terms.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  let out='',at=0;for(const m of line.matchAll(re)){out+=esc(line.slice(at,m.index))+'<mark class="error-word">'+esc(m[0])+'</mark>';at=m.index+m[0].length}return out+esc(line.slice(at));
 }).join('\n');
}
function render(){const p=project();$('projectName').textContent=p?.name||'文案包装校对';document.title=(p?.name?p.name+' · ':'')+'GOK文案包装校对';document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});$('reviewPanel').classList.remove('hidden');$('draftsPanel').classList.add('hidden');$('storyPanel').classList.toggle('hidden',tab!=='story');renderReviews(p);renderStory(p)}



function decisionBlocks(i){
 const a=i.analysis;
 return '<div class="decision-summary">'+esc(a.summary)+'</div>'+
 '<div class="decision-example"><table><thead><tr>'+a.headers.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+a.rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table><p class="decision-caption">'+esc(a.caption)+'</p></div>'+
 '<div class="decision-action"><div class="decision-label">处理建议</div><p>'+esc(a.recommendation)+'</p></div>'+
 (a.reference?'<details class="decision-reference"><summary>排序表述参考 · 待确认</summary><p class="decision-caption">'+esc(a.reference.condition)+'</p><div class="copytext">'+esc(a.reference.text)+'</div></details>':'');
}

function replacementBlocks(i){
 if(i.analysis)return decisionBlocks(i);
 const block=(r,index,alt)=>{
  const attrs=`data-copy-replacement="${esc(i.id)}" data-replacement-index="${index}" ${alt===undefined?'':`data-alternative-index="${alt}"`}`;
  const cross=r.sheet&&r.sheet!==i.sheet;
  return `<div class="replacement"><div class="replacement-head"><span>${cross?`<small class="replacement-sheet">${esc(r.sheet)}</small>`:''}<span class="cell">${esc(r.cell)}</span></span><button class="copy" ${attrs}>复制此单元格</button></div><div class="copytext">${i.showDiff?diffText(r.original,r.text).after:esc(r.text)}</div>${r.shortText?`<details class="short-option"><summary>空间受限时的精简稿</summary><p>${esc(r.shortCondition)}</p><div class="copytext">${esc(r.shortText)}</div><button class="copy" ${attrs} data-short="true">复制精简稿</button></details>`:''}</div>`;
 };
 let out=(i.replacements||[]).map((r,index)=>block(r,index)).join('');
 if(i.alternatives?.length)out+=`<div class="conditional-title">由系统确认规则后，统一采用一套文本</div>`+i.alternatives.map((a,ai)=>`<details class="alternative"><summary>${esc(a.title)}</summary><p class="condition">${esc(a.condition)}</p>${a.replacements.map((r,ri)=>block(r,ri,ai)).join('')}</details>`).join('');
 if(!out)out=`<div class="copytext">${i.showDiff?diffText(i.originals?.length===1?i.originals[0].text:i.original,i.proposal).after:esc(i.proposal)}</div>`;
 return out;
}
function priorityBadge(value){return `<span class="action-priority ${value==='必改'?'required':value==='确认后修改'?'confirm':value==='建议修改'?'suggested':'optional'}">${esc(value||'可选')}</span>`}

function conceptBlocks(i){
 const t=i.conceptTable;
 return '<div class="concept-review"><details class="source-reference"><summary>查看原文与位置</summary><div class="copytext">'+esc(i.original)+'</div></details><div class="concept-table-wrap"><table class="concept-table"><thead><tr>'+t.headers.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(row=>'<tr>'+row.map((v,n)=>'<td data-label="'+esc(t.headers[n])+'">'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(i.formula?'<p class="concept-formula">'+esc(i.formula)+'</p>':'')+'</div>';
}
function additionsBlock(i){
 return (i.additions||[]).map((a,n)=>'<div class="new-copy"><div class="replacement-head"><span class="label">'+esc(a.label)+'</span><button class="copy" data-copy-addition="'+esc(i.id)+'" data-addition-index="'+n+'">复制文案</button></div><div class="copytext">'+esc(a.text)+'</div></div>').join('');
}
function pairedRows(i){
 const rows=i.replacements.map((r,n)=>{
  const original=r.original??i.originals?.find(o=>o.cell===r.cell&&(!r.sheet||o.sheet===r.sheet))?.text;
  const useDiff=original!==undefined&&original!==r.text&&(i.showDiff||original.length<400&&r.text.length<400);
  const diff=useDiff?diffText(original,r.text):null;
  return '<div class="paired-row"><div class="paired-cell original"><div class="replacement-head"><span><small class="replacement-sheet">'+esc(r.sheet||i.sheet)+'</small><span class="cell">'+esc(r.cell)+'</span></span></div><span class="mobile-col-label">原文</span><div class="copytext">'+(original===undefined?'<span class="muted">原文未提供</span>':diff?diff.before:esc(original))+'</div></div><div class="paired-cell proposal"><div class="replacement-head"><span class="mobile-col-label">建议文本</span><button class="copy" data-copy-replacement="'+esc(i.id)+'" data-replacement-index="'+n+'">复制建议</button></div><div class="copytext">'+(diff?diff.after:esc(r.text))+'</div>'+(r.shortText?'<details class="short-option"><summary>空间受限时的精简稿</summary><p>'+esc(r.shortCondition)+'</p><div class="copytext">'+esc(r.shortText)+'</div><button class="copy" data-copy-replacement="'+esc(i.id)+'" data-replacement-index="'+n+'" data-short="true">复制精简稿</button></details>':'')+'</div></div>';
 }).join('');
 const used=new Set(i.replacements.map(r=>(r.sheet||i.sheet)+'!'+r.cell));
 const rest=(i.originals||[]).filter(o=>!used.has((o.sheet||i.sheet)+'!'+o.cell));
 return '<div class="paired-comparison"><div class="paired-head"><span>原文</span><span>建议文本</span></div>'+rows+'</div>'+additionsBlock(i)+(rest.length?'<details class="source-reference extra-reference"><summary>其他引用原文 · 待确认部分</summary>'+rest.map(o=>'<div class="copytext"><span class="cell">'+esc(o.cell)+'</span> '+esc(o.text)+'</div>').join('')+'</details>':'');
}
function pendingBlock(i){
 if(!i.check)return '';
 if(i.kind==='polish'&&i.priority==='可选')return '<details class="supporting-note"><summary>补充说明</summary><p>'+esc(i.check)+'</p></details>';
 return '<div class="pending"><b>采用前需确认</b>　'+esc(i.check)+'</div>';
}
function card(i){
 const hasCells=i.replacements?.length||i.alternatives?.length;
 const badge=priorityBadge(i.priority);
 const priority=(i.kind==='error'&&i.priority==='必改'||i.priority==='可选')?'':badge;
 let comparison;
 if(i.conceptTable)comparison=conceptBlocks(i);
 else if(i.replacements?.length&&!i.alternatives?.length&&!i.analysis)comparison=pairedRows(i);
 else comparison='<div class="comparison"><div class="col original"><div class="label">原文</div><div class="copytext">'+highlighted(i)+'</div></div><div class="col proposal"><div class="label">'+(i.handling&&!hasCells?'处理方案':'建议文本')+'</div>'+replacementBlocks(i)+(i.lengthNote?'<div class="length-note">'+esc(i.lengthNote)+'</div>':'')+'</div></div>'+additionsBlock(i);
 return '<article class="review '+esc(i.kind)+' '+(i.priority==='可选'?'optional-review':'')+'"><div class="cardhead"><div><div class="titleline"><span class="badge">'+labels[i.kind]+'</span><h3>'+esc(i.title)+'</h3>'+priority+'</div><div class="loc">'+esc(i.sheet)+'<span class="cell">'+esc(i.location)+'</span><span class="usage">适用：'+esc(i.usage||'内部设计说明')+'</span></div></div>'+(!hasCells?'<button class="copy" data-copy-item="'+esc(i.id)+'">'+(i.conceptTable?'复制概念表':'复制处理方案')+'</button>':'')+'</div>'+comparison+'<div class="reason"><strong>修改理由</strong>'+esc(i.reason)+(i.actionNote?'<div class="actionnote">'+esc(i.actionNote)+'</div>':'')+'</div>'+pendingBlock(i)+'</article>';
}

function renderReviews(p){
 const all=scopeItems(p);
 const categories=[['all','全部'],...Object.entries(labels)].filter(([k])=>k==='all'?all.length>0:all.some(i=>i.kind===k));
 if(kind!=='all'&&!categories.some(([k])=>k===kind))kind='all';
 const rows=all.filter(matches);
 $('filters').innerHTML=categories.map(([k,l])=>`<button class="chip ${kind===k?'active':''}" data-kind="${k}" aria-pressed="${kind===k}">${l}<span class="count">${k==='all'?all.length:all.filter(i=>i.kind===k).length}</span></button>`).join('');
 $('resultCount').textContent=`${rows.length} / ${all.length} 条建议`;
 const cards=tab==='story'?rows.filter(i=>i.group==='引导配置'):rows;
 const names=[...new Set([...(groups[tab]||[]),...cards.map(i=>i.group)])];
 $('cards').innerHTML=names.map(name=>{const items=ordered(cards.filter(i=>i.group===name));return items.length?`<section aria-label="${esc(name)}"><h2 class="grouphead">${esc(name)}<small>${items.length} 条</small></h2>${items.map(card).join('')}</section>`:''}).join('');
 if(!rows.length)$('cards').innerHTML='<div class="empty"><strong>没有匹配的建议</strong>试试其他关键词或问题类别。</div>';
}
function narrativeIssue(p,line){return(p?.items||[]).filter(i=>(line.reviewIds||[]).includes(i.id))}
function visibleStory(p,line){
 const issues=narrativeIssue(p,line);
 if(kind==='all'&&!query.trim())return true;
 if(issues.some(matches))return true;
 if(kind!=='all'&&!issues.some(i=>i.kind===kind))return false;
 const q=query.trim().toLowerCase();return Boolean(q)&&[line.location,line.speaker,line.originalSpeaker,line.original,line.text].join(' ').toLowerCase().includes(q);
}
function renderStory(p){
 if(tab!=='story'){ $('storyPanel').innerHTML='';return }
 const story=p?.story||[],rows=story.filter(s=>visibleStory(p,s));
 if(!story.length){$('storyPanel').innerHTML='';return}
 const body=rows.map(s=>{
  const issues=narrativeIssue(p,s);const severity=issues.some(i=>i.kind==='error')?'error':issues.some(i=>i.kind==='ambiguity')?'ambiguity':'polish';
  const role=s.originalSpeaker!==s.speaker?`<mark class="error-word">${esc(s.originalSpeaker)}</mark>`:esc(s.originalSpeaker);
  return `<div class="narrative-line ${severity}"><div class="line-meta"><span class="cell">${esc(s.location)}</span>${issues.length?`<span class="badge">${labels[severity]}</span>${priorityBadge(issues.some(i=>i.priority==='必改')?'必改':issues.some(i=>i.priority==='确认后修改')?'确认后修改':'可选')}`:'<span class="unchanged">保留</span>'}</div><div class="line-source"><div class="line-title">原文</div><div class="line-role">${role}</div>${esc(s.original)}</div><div class="line-proposal"><div class="line-title">建议稿</div><div class="line-role">${esc(s.speaker)}</div>${esc(s.text)}${s.changed?`<button class="copy" data-copy-line="${esc(s.location)}">复制建议句</button>`:''}</div>${issues.length?`<div class="line-reason"><b>修改理由：</b>${issues.map(i=>esc(i.reason)+(i.check?`<br><b>待确认：</b>${esc(i.check)}`:'')).join('<br>')}${s.contextNote?`<div class="context-note"><b>衔接检查：</b>${esc(s.contextNote)}</div>`:''}</div>`:''}</div>`;
 }).join('');
 $('storyPanel').innerHTML=(rows.length?`<div class="story-heading"><h2>剧情逐句对照<small>${rows.length} 句</small></h2><button class="copy" id="copyStoryCurrent">复制当前建议稿</button></div><div class="narrative"><div class="narrative-head"><span>位置</span><span>原文 / 发言角色</span><span>建议稿 / 发言角色</span></div>${body}</div>`:'')+`<details class="draft"><summary>保守修正版 · 仅修必改项</summary><button class="copy" id="copyStory">复制保守稿</button><p class="rationale">${esc(p.storyConservativeNote||'仅修正明确错误，保留可选对白原文。')}</p><div class="finaltext">${(p.storyConservative||story).map(s=>esc(s.speaker)+'：'+esc(s.text)).join('\n\n')}</div></details><details class="draft"><summary>润色参考版 · 包含可选调整</summary><p class="rationale">${esc(p.storyPolishNote||'仅作润色参考，非默认定稿。')}</p><button class="copy" id="copyStoryPolish">复制润色参考版</button><div class="finaltext">${story.map(s=>esc(s.speaker)+'：'+esc(s.text)).join('\n\n')}</div></details>`;
}
$('projectSelect').innerHTML=projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.type)}</option>`).join('');
$('projectSelect').value=activeId;
$('projectSelect').addEventListener('change',e=>{activeId=e.target.value;resetView()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;resetView()}});
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(b){kind=b.dataset.kind;renderReviews(project());renderStory(project())}});
$('search').addEventListener('input',e=>{query=e.target.value;renderReviews(project());renderStory(project())});
$('cards').addEventListener('click',e=>{
 const additionButton=e.target.closest('[data-copy-addition]');if(additionButton){const i=project()?.items.find(x=>x.id===additionButton.dataset.copyAddition);const a=i?.additions?.[Number(additionButton.dataset.additionIndex)];if(a)copy(a.text);return}
 const cellButton=e.target.closest('[data-copy-replacement]');
 if(cellButton){const i=project()?.items.find(x=>x.id===cellButton.dataset.copyReplacement);const ai=cellButton.dataset.alternativeIndex;const list=ai===undefined?i?.replacements:i?.alternatives?.[Number(ai)]?.replacements;const r=list?.[Number(cellButton.dataset.replacementIndex)];if(r)copy(cellButton.dataset.short?r.shortText:r.text);return}
 const b=e.target.closest('[data-copy-item]');if(b){const i=project()?.items.find(x=>x.id===b.dataset.copyItem);if(i)copy(i.proposal)}
});
$('storyPanel').addEventListener('click',e=>{if(e.target.closest('#copyStoryCurrent'))copy(project().story.filter(s=>visibleStory(project(),s)).map(s=>s.speaker+'：'+s.text).join('\n\n'));if(e.target.closest('#copyStory'))copy((project().storyConservative||project().story).map(s=>s.speaker+'：'+s.text).join('\n\n'));if(e.target.closest('#copyStoryPolish'))copy(project().story.map(s=>s.speaker+'：'+s.text).join('\n\n'));const b=e.target.closest('[data-copy-line]');if(b){const line=project()?.story.find(s=>s.location===b.dataset.copyLine);if(line)copy(line.text)}});
window.addEventListener('hashchange',()=>{const r=new URLSearchParams(location.hash.slice(1));const id=r.get('project'),view=r.get('tab');if(projects.some(p=>p.id===id))activeId=id;if(['interface','direction','story'].includes(view))tab=view;$('projectSelect').value=activeId;resetView()});
render();
</script>
</body></html>
