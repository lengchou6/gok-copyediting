","scope":"story","highlights":[],"priority":"可选","usage":"剧情展示","replacements":[{"cell":"G86","text":"那是星缘。星轨相连的人，各自的成长都能让圣命星更加明亮，再由它辉映彼此的天命星。就像有人相伴，前面的路也会亮一些。","sheet":"4.1文案需求","original":"那便是“星缘”，就像因缘相聚的姐妹们。中央的是圣命星，祖母说，相伴的人越是同心，它的光芒就越明亮，照看着彼此的天命星。"}],"actionNote":"原句的情感表达可以保留，此项不属于机制错误。","originals":[{"sheet":"4.1文案需求","cell":"G86","text":"那便是“星缘”，就像因缘相聚的姐妹们。中央的是圣命星，祖母说，相伴的人越是同心，它的光芒就越明亮，照看着彼此的天命星。"}]},{"id":"astra-29","kind":"error","group":"剧情引导","title":"第三人称动作误放角色对白","sheet":"4.1文案需求","location":"E88、F88","original":"E88：对话样式\nF88：本期投放妃子","proposal":"E88、F88改为：旁白。\nG88原文保留。","reason":"“她笑着挪开……”是动作叙述，当前却标为角色对白，不应由妃子直接说出。","check":"","scope":"story","highlights":[],"handling":true,"priority":"必改","usage":"剧情展示","replacements":[{"cell":"E88","text":"旁白","sheet":"4.1文案需求","original":"对话样式"},{"cell":"F88","text":"旁白","sheet":"4.1文案需求","original":"本期投放妃子"}],"actionNote":"G88保留原文，仅调整E88、F88的样式与角色。","originals":[{"sheet":"4.1文案需求","cell":"E88","text":"对话样式"},{"sheet":"4.1文案需求","cell":"F88","text":"本期投放妃子"}]},{"id":"astra-30","kind":"ambiguity","group":"引导配置","title":"系统首次引导与促销首次引导混用","sheet":"4.1文案需求","location":"B79","original":"B79：【首次进入活动播放剧情对话】","proposal":"若用于常驻系统：首次进入星命系统时播放。\n若用于促销活动：首次进入本期促销活动时播放，并调整“初次发现星图”的设定。","reason":"常驻系统与每期促销的触发频率不同，必须先确认，避免每期重复首次发现的剧情。","check":"需系统确认剧情触发是账号首次一次，还是每期活动首次一次，再使用对应文本。","scope":"story","highlights":[],"handling":true,"priority":"确认后修改","usage":"需系统确认的引导配置","replacements":[],"alternatives":[{"title":"方案A：系统首次引导","condition":"若仅在玩家首次进入星命系统时播放。","replacements":[{"cell":"B79","text":"首次进入星命系统时播放剧情对话，仅播放一次。","sheet":"4.1文案需求","original":"【首次进入活动播放剧情对话】"}]},{"title":"方案B：每期促销引导","condition":"若每期活动首次进入时播放。","replacements":[{"cell":"B79","text":"首次进入本期星命促销活动时播放剧情对话，每期仅播放一次。","sheet":"4.1文案需求","original":"【首次进入活动播放剧情对话】"}]}],"actionNote":"若采用方案B，复用剧情时需避免每期都重复“首次发现星图”的情境。","originals":[{"sheet":"4.1文案需求","cell":"B79","text":"【首次进入活动播放剧情对话】"}]},{"id":"astra-31","kind":"error","group":"属性与术语","title":"名词表误写未定义的技能名称","sheet":"1.1潜能系统 "群星闪耀，珍藏的星图正等待被唤醒。与妃子一同探寻星辰中的力量，逐步点亮星图，让她的天赋化作关联勇士的助力。当星石绽放光芒，更强的力量也将随之苏醒。星缘相连的妃子们，还将在各自的成长中彼此辉映，让圣命星的祝福愈加强盛。今夜，便与她共赴这场追寻星光的旅程。","reason":"减少概念堆叠，突出星辰探索、相伴成长与勇士受益。","scope":"interface"},{"id":"core","title":"核心体验","audience":"内部评审","sheet":"4.1文案需求","location":"H49","original":"逐步点亮星图，培养妃子的天赋；以星石增强关联勇士，并开启下一颗天命星的养成。通过妃子收集、套系升星和华服培养，推动圣命星升级。","text":"玩家为选定妃子消耗天命石和祝福石，逐级培养天命星中的技能，持续提升关联勇士属性。当前阶段技能全部满级后，可点亮星石，获得额外加成并解锁下一阶段，形成“技能升级—星石突破—下一阶段”的成长节奏。\n\n套系内妃子的收集、升星或皮肤培养达到对应条件后，可升级圣命星，放大本套系的天命星加成。玩家根据关联勇士的培养需求，选择优先投入的妃子与套系。","reason":"按操作、收益和下一步目标描述功能，不将非主力妃子培养写成已达成效果。","scope":"direction"}],"story":[{"location":"G81","speaker":"旁白","text":"夜色笼罩草原，王帐中却仍亮着灯火。你循着灯光走近，只见妃子正将一幅星图铺在桌上，图角还压着几颗晶莹的石头。","changed":false,"original":"夜色笼罩草原，王帐中却仍亮着灯火。你循着灯光走近，只见妃子正将一幅星图铺在桌上，图角还压着几颗晶莹的石头。","originalSpeaker":"旁白","reviewIds":[],"contextNote":""},{"location":"G82","speaker":"本期投放妃子","text":"可汗，您来得正好！听说群星藏着人们尚未发现的力量。我找了好久，终于寻到了这幅星图。","changed":true,"original":"可汗，您来得正好！小时候，祖母总指着星空说，每个人都有属于自己的天命星。我找了好久，终于寻到了这幅星图。","originalSpeaker":"本期投放妃子","reviewIds":["astra-25"],"contextNote":"后接可汗询问“找到自己的那颗星了吗”；“寻到星图”与“尚未找到星辰”仍能衔接。"},{"location":"G83","speaker":"{可汗昵称}","text":"难怪这几晚都见你望着天上。怎么样，找到自己的那颗星了吗？","changed":false,"original":"难怪这几晚都见你望着天上。怎么样，找到自己的那颗星了吗？","originalSpeaker":"{可汗昵称}","reviewIds":[],"contextNote":""},{"location":"G84","speaker":"本期投放妃子","text":"还没有呢。图上说，要沿着星轨慢慢唤醒其中的力量，直到星石亮起。可这漫天的星星，我一个人恐怕要找上许久……您愿意陪我吗？","changed":true,"original":"还没有呢。不过据说，沿着星图找到自己的天命星，就能唤醒相应的星石，得到星辰的庇佑。您愿意陪我一起找吗？","originalSpeaker":"本期投放妃子","reviewIds":["astra-26"],"contextNote":"回应上一句“找到了吗”，再邀请可汗陪伴；下一句“当然”能够自然接住邀请。"},{"location":"G85","speaker":"{可汗昵称}","text":"当然。不过，这些彼此相连的星辰，又有什么特别之处？","changed":true,"original":"当然。只是这图上，有些星辰连在一起，又都围着一颗大星，这是为什么？","originalSpeaker":"{可汗昵称}","reviewIds":["astra-27"],"contextNote":"先答应陪伴，再提问星缘，为下一句解释保留明确话题。"},{"location":"G86","speaker":"本期投放妃子","text":"那是星缘。星轨相连的人，各自的成长都能让圣命星更加明亮，再由它辉映彼此的天命星。就像有人相伴，前面的路也会亮一些。","changed":true,"original":"那便是“星缘”，就像因缘相聚的姐妹们。中央的是圣命星，祖母说，相伴的人越是同心，它 忆\n完整收藏物：春游留影\n收藏物碎片：留影碎片\n图鉴：春游画册\n消耗道具：闲游令\n操作按钮：闲游一次／闲游十次\n积分与倍率：保留闲趣积分、闲趣加成。\n\n“闪卡”保留为内部策划称谓。若最终美术更偏古典绘画，可备选“春游绘卷／绘卷碎片”，作为另一整套命名取舍，不与留影方案混用。","reason":"“闪卡”容易使玩家期待镭射、闪光或动态卡面，现有需求未明确这些表现。“春游拾忆—春游留影—春游画册”分别对应玩法、收藏物与图鉴，形成可理解的收集关系。留影可通过插画或画卷呈现，无需引入摄影设定。","check":"先核对与现有道具及系统的重名情况，再确认采用。统一同步入口、奖池预览、奖励名称、收集说明、图鉴、剧情和本地化术语，不直接更改配置KEY。","kind":"polish","priority":"可选","usage":"内部设计说明","highlights":[],"replacements":[],"handling":true},{"id":"ranking-24","scope":"interface","group":"介绍与说明","title":"闲游首屏明确消耗、随机奖励与集齐收益","sheet":"文案包装","location":"E64（新增抽取说明建议）","original":"E64：将妃子春游中的不同片刻呈现在闪卡中。玩家通过抽取闪卡、收集碎片与合成卡片，收集春日游赏画面，并获得闲趣积分与闲趣加成。","proposal":"建议抽取页首屏说明：\n消耗闲游令进行闲游，随机获得留影碎片或道具。集齐一张春游留影，可获得闲趣加成，提升盛典竞榜积分。\n\n入口采用“春游拾忆”；按钮采用“闲游一次／闲游十次”，在按钮旁明确展示对应道具图标与消耗数量。","reason":"入口名负责春游氛围，说明文本负责讲清消耗、随机抽取和集齐收益。仅写“闲游收集”不足以让玩家知道实际操作和付费道具用途。","check":"文案按最终命名与界面容量调整。消耗数量读取配置，不将示例数值写死；需UI确认现有控件承载方式。","kind":"polish","priority":"可选","usage":"玩家展示","highlights":[],"replacements":[],"handling":true},{"id":"ranking-25","scope":"direction","group":"概念关系","title":"地图表现不承诺额外探索与剧情","sheet":"系统规则","location":"D162、E212","original":"D162：每一次会在当前阶段的几个目的地中随机挑选一个地点进行闲游\nE212：消耗#1#个【闲游令】可以进行#1#次闲游，从当前地图上随机挑选一个目的地闲游","proposal":"地图用于表现随机闲游地点及抽取结果，包装突出“闲游带回春日珍藏”。当前不增加“自由选择地点”“探索专属事件”“邂逅专属故事”等承诺。\n不同地点若仅有表现差异，不暗示其拥有不同奖励或概率；如后续确有玩法差异，再补齐对应说明。","reason":"现有规则是随机选择目的地并获得奖励，未定义路线决策、探索事件或地点剧情。文案应使玩家的预期与实际抽取操作一致。","check":"本建议不要求新增探索或剧情功能；新增功能必须另行立项确认，剧情仍受既有开发前提约束。","kind":"polish","priority":"可选","usage":"内部设计说明","highlights":[],"replacements":[],"handling":true},{"id":"ranking-26","scope":"interface","group":"收集反馈","title":"新碎片与整张留影完成区分反馈","sheet":"系统规则","location":"E177、E178（反馈表现建议）","original":"E177：每获取一张未拥有的闪卡碎片，将获得#N#点闲趣值\nE178：收集闪卡碎片，若闪卡碎片能够构成一张完整的闪卡，则可以获得闲趣加成#M#%，仅可获得1次","proposal":"新碎片：突出“新获得”，并展示对应春游留影的收集进度。\n整张完成：展示完整插画，明确提示“春游留影已集齐”及本次获得的闲趣加成。\n重复碎片：明确显示已转化为闲趣积分，避免误认为碎片丢失。\n\n以“逐步补齐春游画面”建立收集体验；无需为留影名称额外增加摄影、探索或剧情功能。","reason":"新碎片、集齐整张和重复转化是不同结果，应提供不同反馈。完整画面与加成同时出现，可将情感收藏与冲榜收益对应起来。","check":"收集进度、完 nservative":[{"location":"G86","speaker":"旁白","text":"王庭盛典即将开启，各地贵族与妃子纷纷前往王庭，共赴这场一年一度的春日盛会。春风拂过草原，花海映着湖光，一场融合春日闲趣与荣誉竞逐的盛典即将拉开序幕"},{"location":"G87","speaker":"本期投放妃子","text":"可汗！王庭盛典的筹备已经完成啦！大家都准备好好游赏一番，还有不少人想在竞榜中争个好名次呢。"},{"location":"G88","speaker":"{可汗昵称}","text":"哈哈！既是王庭盛典，自然不能只有赏花游湖，也得分出个高下！"},{"location":"G89","speaker":"本期投放妃子","text":"可不是嘛，可汗！这次盛典一共有四轮竞逐，闲游收集、完成游园事务、积累名望，都能获得盛典积分，还有机会一路晋阶，争夺最后的荣耀呢！"},{"location":"G90","speaker":"{可汗昵称}","text":"四轮竞逐？听起来倒是有趣。那可得好好表现一番了！"},{"location":"G91","speaker":"本期投放妃子","text":"那是当然啦！大家可都摩拳擦掌呢，可汗也要加把劲，千万别被别人抢了风头呀！"},{"location":"G92","speaker":"{可汗昵称}","text":"哈哈！那就传令下去，王庭盛典正式开启！这场盛典的头名，我势在必得！"},{"location":"G93","speaker":"旁白","text":"春色正好，盛会已至。四轮竞逐，谁能脱颖而出，赢得最终荣耀？王庭盛典，正式拉开序幕！"}],"storyConservativeNote":"仅在确认新增剧情播放功能并纳入开发排期后，才进入正式剧情配置。保守版保留原句；随后需确认本期出演妃子和首次播放范围。若不开发，改由现有活动引导弹窗承载背景介绍，以下对白仅作备用参考。","storyPolishNote":"本稿以本期新增剧情播放功能为前提，当前仅作可选润色参考，不代表已具备播放能力。沿用原有8句与角色顺序，调整春游陪伴、积分途径及竞榜衔接；功能开发确认后，再由文案与系统评审采用。"},{"id":"peak-war","name":"巅峰盟战","type":"活动","version":"待排期","updated":"2026-10-26","source":"【待排期】巅峰盟战_执行文档(1).xlsx","summary":"沿用盟战攻城对抗，加入分段晋级、指挥营备战与个人、联盟双线荣誉。","note":"以本次执行文档为准；建议尚未写回工作簿。连胜口径、冠军排序、榜单范围和剧情复用能力需确认，未将建议写成已定规则。","items":[{"id":"peak-01","scope":"interface","group":"介绍与说明","title":"活动介绍突出晋级与双线荣誉","sheet":"文案需求","location":"D49","original":"文案需求 · D49：联盟争霸开启以来，各大联盟历经无数战斗，在荣耀与挑战中不断成长。一次次争锋，诞生了无数强者，也留下了无数传奇。如今，普通的较量已无法满足真正的强者，一场汇聚天下顶尖联盟的巅峰对决即将拉开序幕。","originals":[{"sheet":"文案需求","cell":"D49","text":"联盟争霸开启以来，各大联盟历经无数战斗，在荣耀与挑战中不断成长。一次次争锋，诞生了无数强者，也留下了无数传奇。如今，普通的较量已无法满足真正的强者，一场汇聚天下顶尖联盟的巅峰对决即将拉开序幕。"}],"proposal":"战鼓再起，各大联盟整军集结，共赴巅峰之争。与盟友并肩征战，攻占城池、争夺王城，在一场场较量中向王者段位进军。备战积威，临阵扬名，既为联盟争取更高荣誉，也以个人战绩角逐巅峰榜。待赛季战尘落定，巅峰联盟将入驻王帐，让胜利的旗帜迎风高扬。","reason":"原稿连续铺陈强者、荣耀与传奇，并以普通较量无法满足强者抬高新活动。建议保留战争气势，同时点出联盟晋级、个人争榜和王帐荣誉，不暗示普通盟战失去价值。","kind":"polish","priority":"可选","check":"","usage":"玩家展示","highlights":[],"replacements":[{"sheet":"文案需求","cell":"D49","original":"联盟争霸开启以来，各大联盟历经无数战斗，在荣耀与挑战中不断成长。一次次争锋，诞生了无数强者，也留下了无数传奇。如今，普通的较量已无法满足真正的强者，一场汇聚天下顶尖联盟的巅峰对决即将拉开序幕。","text":"战鼓再起，各大联盟整军集结，共赴巅峰之争。与盟友并肩征战，攻占城池、争夺王城，在一场场较量中向王者段位进军。备战积威，临阵扬名，既为联盟争取更高荣誉，也以个人战绩角逐巅峰榜。待赛季战尘落定，巅峰联盟将入驻王帐，让胜利的旗帜迎风高扬。"}],"handling":false,"lengthNote":"116字（含标点）；原表介绍栏要求100—150字。"},{"id":"peak-02","scope":"direction","group":"核心体验","title":"以逐级登顶串联备战、战斗和荣誉","sheet":"文案需求","location":"H49","original":"文案需求 · H49：联盟争霸，强强对决","originals":[{"sheet":"文案需求","cell":"H49","text":"联盟争霸，强强对决"}],"proposal":"核心体验：强盟争锋，逐级登顶。\n玩家每周报名参战，通过备战任务提升威望等级，在战场上占领、攻防与集结，争取本场积分和段位晋升。联盟追求王者资格及赛季荣誉；个人在王者段累计击杀精兵，竞争巅峰榜。赛季结算后，优胜联盟获得王帐展示。","reason":"“强强对决”只写竞争氛围，未解释玩家持续四周的目标。补齐联盟与个人两条追求，作为文案和美术共用的内部方向。","kind":"polish","priority":"可选","check":"","usage":"内部设计说明","highlights":[],"replacements":[],"handling":true},{"id":"peak-03","scope":"direction","group":"概念关系","title":"连胜名称与累计保段规则不一致","sheet":"文案需求 / 1.系统概述","location":"B66、E66、G201、G315、G660","original":"文案需求 · B66：连胜\n文案需求 · E66：在最高级段位获得前n名，停留在最高段位，机制上同保级\n1.系统概述 · G201：在最高段位内获得本场#前4#名的联盟算连胜，根据本赛季累计连胜次数可获得连胜加成\n1.系统概述 · G315：——连胜概念：后续在奖励时会根据连胜次数计算，机制上也是保级\n1.系统概述 · G660：赛季结算时，根据联盟达到过的最高段位、累计连胜场次领取对应奖励","originals":[{"sheet":"文案需求","cell":"B66","text":"连胜"},{"sheet":"文案需求","cell":"E66","text":"在最高级段位获得前n名，停留在最高段位，机制上同保级"},{"sheet":"1.系统概述","cell":"G201","text":"在最高段位内获得本场#前4#名的联盟算连胜，根据本赛季累计连胜次数可获得连胜加成"},{"sheet":"1.系统概述","cell":"G315","text":"——连胜概念：后续在奖励时会根据连胜次数计算，机制上也是保级"},{"sheet":"1.系统概述","cell":"G660","text":"赛季结算时，根据联盟达到过的最高段位、累计连胜场次领取对应奖励"}],"proposal":"按当前累计保段规则，优先使用“王者保级次数”。若需荣誉包装，可采用“王者卫冕次数”，首次说明“在王者段达到本场保级名次，记为一次卫冕”。\n若确实要称“连胜”，先明确连续判定、失败中断和再次进入王者后的计数规则。确认后同步结算、成就、匹配说明与王帐条件，不先批量替换。","reason":"六联盟战场前四名均可计数，且文档按赛季累计，未定义连续性。“连胜”会让玩家预期必须连续获胜；仅换成卫冕也需解释其特殊含义。","kind":"ambiguity","priority":"确认后修改","check":"确认累计还是连续；固定前4口径与按战场人数给出的保级表也需一致。","usage":"内部设计说明","highlights":[],"replacements":[],"handling":true},{"id":"peak-04","scope":"direction","group":"概念关系","title":"冠军判定确认后再使用最强联盟","sheet":"1.系统概述 / 2.一级界面 / 文案需求","location":"E794、I381、E70","original":"1.系统概述 · E794：入驻规则：巅峰战最后一场战斗结束后入驻，每个赛区的累计连胜次数最多且联盟赛季积分第一的联盟 峰王帐，每日接受其他可汗点赞，享受至高无上的荣耀！\n入驻的可汗将在下次巅峰盟战赛季结算时刷新。\n    \n盟主席位         \n入驻联盟的盟主，将自动落座到盟主位置\n若入驻期间盟主发生变化，则该位置将自动转移给新盟主\n\n成员席位 \n入驻巅峰王帐的盟主，可指派4名本赛季参战的成员落座成员席位，共享荣耀；\n盟主入驻期间可随时更换成员席位的玩家，每周可更换1次，每周1刷新次数；\n\n点赞\n所有本赛季处于同一赛区的可汗每日可向该联盟点赞1次，并获得回礼；\n每日未使用的点赞次数将失效，不会累计到次日。\n\n入驻王帐期间，无法解散联盟","originals":[{"sheet":"3.其他界面","cell":"S409","text":"您可以选择上赛季参与本联盟#巅峰盟战#的盟友入住"},{"sheet":"5.相关系统","cell":"S70","text":"入驻巅峰王帐是实力强大的象征。\n\n入驻条件        \n巅峰盟战最强联盟可入驻巅峰王帐，每日接受其他可汗点赞，享受至高无上的荣耀！\n入驻的可汗将在下次巅峰盟战赛季结算时刷新。\n    \n盟主席位         \n入驻联盟的盟主，将自动落座到盟主位置\n若入驻期间盟主发生变化，则该位置将自动转移给新盟主\n\n成员席位 \n入驻巅峰王帐的盟主，可指派4名本赛季参战的成员落座成员席位，共享荣耀；\n盟主入驻期间可随时更换成员席位的玩家，每周可更换1次，每周1刷新次数；\n\n点赞\n所有本赛季处于同一赛区的可汗每日可向该联盟点赞1次，并获得回礼；\n每日未使用的点赞次数将失效，不会累计到次日。\n\n入驻王帐期间，无法解散联盟"}],"proposal":"建议统一表述“在本次王帐所属的巅峰盟战赛季，曾代表本联盟成功参战的当前成员”。\n玩家短提示可用“可指派在对应赛季代表本盟成功参战的成员入驻”。\n同步每个座位独立的周更换次数说明，不将四个座位合并成每周总共一次。","reason":"入驻期间跨越下一赛季，“本赛季／上赛季”会随时间改变含义；还需区分成功参战与仅完成报名。","kind":"ambiguity","priority":"确认后修改","check":"确认按哪一届巅峰赛季保存参战资格、当前成员过滤、周更换次数及空座首次指派规则。","usage":"玩家展示","highlights":[],"replacements":[],"handling":true},{"id":"peak-21","scope":"direction","group":"主题命名","title":"金鹰统领荣誉视觉，段位命名按统一方案同步","sheet":"场景需求1-基础场景","location":"H16、H17、H19","original":"场景需求1-基础场景 · H16：UI弹窗可使用类似城墙的木质或石质底板，围绕营地、王城建筑、鹰、苏鲁锭、旗帜、兵器等蒙古战争元素进行设计\n场景需求1-基础场景 · H17：成就弹窗可抓取金鹰元素来体现奖励，其他可用王城、营帐、兵器等战争元素点缀，但整体以表现正向奖励为主\n场景需求1-基础场景 · H19：1.场景功能：荣耀展示5个联盟玩家形象\n2.场景概念：巅峰王帐\n3.场景时间：白天\n4.场景色调：橙金，辉煌荣耀感\n5.场景景别：中远\n6.场景内容：\n可基于AI参考调优制作，整体以金鹰元素制作，最底部的桌子不需要\n背景为帘帐打开的外景，可看到远处的宏大的军阵、联盟旗帜等\n内景需要设计4张椅子来遮挡所展示角色的下半身\n\n","originals":[{"sheet":"场景需求1-基础场景","cell":"H16","text":"UI弹窗可使用类似城墙的木质或石质底板，围绕营地、王城建筑、鹰、苏鲁锭、旗帜、兵器等蒙古战争元素进行设计"},{"sheet":"场景需求1-基础场景","cell":"H17","text":"成就弹窗可抓取金鹰元素来体现奖励，其他可用王城、营帐、兵器等战争元素点缀，但整体以表现正向奖励为主"},{"sheet":"场景需求1-基础场景","cell":"H19","text":"1.场景功能：荣耀展示5个联盟玩家形象\n2.场景概念：巅峰王帐\n3.场景时间：白天\n4.场景色调：橙金，辉煌荣耀感\n5.场景景别：中远\n6.场景内容：\n可基于AI参考调优制作，整体以金鹰元素制作，最底部的桌子不需要\n背景为帘帐打开的外景，可看到远处的宏大的军阵、联盟旗帜等\n内景需要设计4张椅子来遮挡所展示角色的下半身\n\n"}],"proposal":"建议金鹰作为巅峰盟战的荣誉主标识，军阵、苏鲁锭、联盟旗帜承担战争氛围 <script>'use strict';
const base=JSON.parse(document.getElementById('review-data').textContent);
const labels={error:'明确错误',ambiguity:'概念歧义',polish:'表达优化'};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const projects=base.projects;
let activeId=projects[0]?.id,kind='all',tab='interface',query='';
const groups={interface:['介绍与说明','培养操作','属性与术语','需系统确认'],direction:['主题命名','概念关系','核心体验'],story:['引导配置','剧情引导']};
function project(){return projects.find(p=>p.id===activeId)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),2200)}
async function copy(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const el=document.createElement('textarea');el.value=text;el.style.position='fixed';el.style.left='-10000px';document.body.append(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw Error('copy')}toast('已复制')}catch(e){toast('复制受限，请选中文本手动复制')}}
function rowNum(i){return Math.min(...(i.location.match(/\d+/g)||['0']).map(Number))}
function ordered(items){return [...items].sort((a,b)=>a.sheet.localeCompare(b.sheet,'zh-CN')||rowNum(a)-rowNum(b))}
function scopeItems(p){return(p?.items||[]).filter(i=>i.scope===tab)}
function matches(i){const q=query.trim().toLowerCase();return(kind==='all'||i.kind===kind)&&(!q||[i.title,i.sheet,i.location,i.original,i.proposal,i.reason,i.check,i.group,i.actionNote,i.priority,i.usage,JSON.stringify(i.replacements||[]),JSON.stringify(i.alternatives||[])].join(' ').toLowerCase().includes(q))}
function highlighted(i){
 if(i.kind!=='error')return esc(i.original);
 return i.original.split('\n').map(line=>{
  let words=i.highlights||[];
  if(i.id==='astra-24')words=/^[KO]987/.test(line)?['图腾加成']:['图腾加成','#n1#'];
  if(i.id==='astra-31')words=line.startsWith('D30')?[]:words;
  const terms=[...new Set(words)].filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!terms.length)return esc(line);
  const re=new RegExp(terms.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  let out='',at=0;for(const m of line.matchAll(re)){out+=esc(line.slice(at,m.index))+'<mark class="error-word">'+esc(m[0])+'</mark>';at=m.index+m[0].length}return out+esc(line.slice(at));
 }).join('\n');
}
function render(){const p=project();$('projectName').textContent=p?.name||'文案包装校对';document.title=(p?.name?p.name+' · ':'')+'GOK文案包装校对';document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});$('reviewPanel').classList.remove('hidden');$('draftsPanel').classList.add('hidden');$('storyPanel').classList.toggle('hidden',tab!=='story');renderReviews(p);renderStory(p)}


function replacementBlocks(i){
 const block=(r,index,alt)=>{
  const attrs=`data-copy-replacement="${esc(i.id)}" data-replacement-index="${index}" ${alt===undefined?'':`data-alternative-index="${alt}"`}`;
  const cross=r.sheet&&r.sheet!==i.sheet;
  return `<div class="replacement"><div class="replacement-head"><span>${cross?`<small class="replacement-sheet">${esc(r.sheet)}</small>`:''}<span class="cell">${esc(r.cell)}</span></span><button class="copy" ${attrs}>复制此单元格</button></div><div class="copytext">${esc(r.text)}</div>${r.shortText?`<details class="short-option"><summary>空间受限时的精简稿</summary><p>${esc(r.shortCondition)}</p><div class="copytext">${esc(r.shortText)}</div><button class="copy" ${attrs} data-short="true">复制精简稿</button></details>`:''}</div>`;
 };
 let out=(i.replacements||[]).map((r,index)=>block(r,index)).join('');
 if(i.alternatives?.length)out+=`<div class="conditional-title">由系统确认规则后，统一采用一套文本</div>`+i.alternatives.map((a,ai)=>`<details class="alternative"><summary>${esc(a.title)}</summary><p class="condition">${esc(a.condition)}</p>${a.replacements.map((r,ri)=>block(r,ri,ai)).join('')}</details>`).join('');
 if(!out)out=`<div class="copytext">${esc(i.proposal)}</div>`;
 return out;
}
function priorityBadge(value){return `<span class="action-priority ${value==='必改'?'required':value==='确认后修改'?'confirm':'optional'}">${esc(value||'可选')}</span>`}
function card(i){
 const hasCells=i.replacements?.length||i.alternatives?.length;
 return `<article class="review ${esc(i.kind)}"><div class="cardhead"><div><div class="titleline"><span class="badge">${labels[i.kind]}</span><h3>${esc(i.title)}</h3>${priorityBadge(i.priority)}</div><div class="loc">${esc(i.sheet)}<span class="cell">${esc(i.location)}</span><span class="usage">适用：${esc(i.usage||'内部设计说明')}</span></div></div>${hasCells?'':`<button class="copy" data-copy-item="${esc(i.id)}">复制处理方案</button>`}</div><div class="comparison"><div class="col original"><div class="label">原文</div><div class="copytext">${highlighted(i)}</div></div><div class="col proposal"><div class="label">${i.handling&&!hasCells?'处理方案':'建议文本'}</div>${replacementBlocks(i)}${i.lengthNote?`<div class="length-note">${esc(i.lengthNote)}</div>`:''}</div></div><div class="reason"><strong>修改理由</strong>${esc(i.reason)}${i.actionNote?`<div class="actionnote">${esc(i.actionNote)}</div>`:''}</div>${i.check?`<div class="pending"><b>待确认</b>　${esc(i.check)}</div>`:''}</article>`
}
function renderReviews(p){
 const all=scopeItems(p);
 const categories=[['all','全部'],...Object.entries(labels)].filter(([k])=>k==='all'?all.length>0:all.some(i=>i.kind===k));
 if(kind!=='all'&&!categories.some(([k])=>k===kind))kind='all';
 const rows=all.filter(matches);
 $('filters').innerHTML=categories.map(([k,l])=>`<button class="chip ${kind===k?'active':''}" data-kind="${k}" aria-pressed="${kind===k}">${l}<span class="count">${k==='all'?all.length:all.filter(i=>i.kind===k).length}</span></button>`).join('');
 $('resultCount').textContent=`${rows.length} / ${all.length} 条建议`;
 const cards=tab==='story'?rows.filter(i=>i.group==='引导配置'):rows;
 const names=[...new Set([...(groups[tab]||[]),...cards.map(i=>i.group)])];
 $('cards').innerHTML=names.map(name=>{const items=ordered(cards.filter(i=>i.group===name));return items.length?`<section aria-label="${esc(name)}"><h2 class="grouphead">${esc(name)}<small>${items.length} 条</small></h2>${items.map(card).join('')}</section>`:''}).join('');
 if(!rows.length)$('cards').innerHTML='<div class="empty"><strong>没有匹配的建议</strong>试试其他关键词或问题类别。</div>';
}
function narrativeIssue(p,line){return(p?.items||[]).filter(i=>(line.reviewIds||[]).includes(i.id))}
function visibleStory(p,line){
 const issues=narrativeIssue(p,line);
 if(kind==='all'&&!query.trim())return true;
 if(issues.some(matches))return true;
 if(kind!=='all'&&!issues.some(i=>i.kind===kind))return false;
 const q=query.trim().toLowerCase();return Boolean(q)&&[line.location,line.speaker,line.originalSpeaker,line.original,line.text].join(' ').toLowerCase().includes(q);
}
function renderStory(p){
 if(tab!=='story'){ $('storyPanel').innerHTML='';return }
 const story=p?.story||[],rows=story.filter(s=>visibleStory(p,s));
 if(!story.length){$('storyPanel').innerHTML='';return}
 const body=rows.map(s=>{
  const issues=narrativeIssue(p,s);const severity=issues.some(i=>i.kind==='error')?'error':issues.some(i=>i.kind==='ambiguity')?'ambiguity':'polish';
  const role=s.originalSpeaker!==s.speaker?`<mark class="error-word">${esc(s.originalSpeaker)}</mark>`:esc(s.originalSpeaker);
  return `<div class="narrative-line ${severity}"><div class="line-meta"><span class="cell">${esc(s.location)}</span>${issues.length?`<span class="badge">${labels[severity]}</span>${priorityBadge(issues.some(i=>i.priority==='必改')?'必改':issues.some(i=>i.priority==='确认后修改')?'确认后修改':'可选')}`:'<span class="unchanged">保留</span>'}</div><div class="line-source"><div class="line-title">原文</div><div class="line-role">${role}</div>${esc(s.original)}</div><div class="line-proposal"><div class="line-title">建议稿</div><div class="line-role">${esc(s.speaker)}</div>${esc(s.text)}${s.changed?`<button class="copy" data-copy-line="${esc(s.location)}">复制建议句</button>`:''}</div>${issues.length?`<div class="line-reason"><b>修改理由：</b>${issues.map(i=>esc(i.reason)+(i.check?`<br><b>待确认：</b>${esc(i.check)}`:'')).join('<br>')}${s.contextNote?`<div class="context-note"><b>衔接检查：</b>${esc(s.contextNote)}</div>`:''}</div>`:''}</div>`;
 }).join('');
 $('storyPanel').innerHTML=(rows.length?`<div class="story-heading"><h2>剧情逐句对照<small>${rows.length} 句</small></h2><button class="copy" id="copyStory">复制保守修正版</button></div><div class="narrative"><div class="narrative-head"><span>位置</span><span>原文 / 发言角色</span><span>建议稿 / 发言角色</span></div>${body}</div>`:'')+`<details class="draft"><summary>保守修正版 · 仅修必改项</summary><p class="rationale">${esc(p.storyConservativeNote||'仅修正明确错误，保留可选对白原文。')}</p><div class="finaltext">${(p.storyConservative||story).map(s=>esc(s.speaker)+'：'+esc(s.text)).join('\n\n')}</div></details><details class="draft"><summary>润色参考版 · 包含可选调整</summary><p class="rationale">${esc(p.storyPolishNote||'仅作润色参考，非默认定稿。')}</p><button class="copy" id="copyStoryPolish">复制润色参考版</button><div class="finaltext">${story.map(s=>esc(s.speaker)+'：'+esc(s.text)).join('\n\n')}</div></details>`;
}
$('projectSelect').innerHTML=projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.type)}</option>`).join('');
$('projectSelect').addEventListener('change',e=>{activeId=e.target.value;query='';$('search').value='';kind='all';render()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;kind='all';query='';$('search').value='';render()}});
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(b){kind=b.dataset.kind;renderReviews(project());renderStory(project())}});
$('search').addEventListener('input',e=>{query=e.target.value;renderReviews(project());renderStory(project())});
$('cards').addEventListener('click',e=>{
 const cellButton=e.target.closest('[data-copy-replacement]');
 if(cellButton){const i=project()?.items.find(x=>x.id===cellButton.dataset.copyReplacement);const ai=cellButton.dataset.alternativeIndex;const list=ai===undefined?i?.replacements:i?.alternatives?.[Number(ai)]?.replacements;const r=list?.[Number(cellButton.dataset.replacementIndex)];if(r)copy(cellButton.dataset.short?r.shortText:r.text);return}
 const b=e.target.closest('[data-copy-item]');if(b){const i=project()?.items.find(x=>x.id===b.dataset.copyItem);if(i)copy(i.proposal)}
});
$('storyPanel').addEventListener('click',e=>{if(e.target.closest('#copyStory'))copy((project().storyConservative||project().story).map(s=>s.speaker+'：'+s.text).join('\n\n'));if(e.target.closest('#copyStoryPolish'))copy(project().story.map(s=>s.speaker+'：'+s.text).join('\n\n'));const b=e.target.closest('[data-copy-line]');if(b){const line=project()?.story.find(s=>s.location===b.dataset.copyLine);if(line)copy(line.text)}});
render();
</script>
</body></html>
