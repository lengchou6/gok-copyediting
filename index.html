<script id="review-data" type="application/json">{"schemaVersion":1,"projects":[{"id":"consort-astra","name":"妃子星命","type":"系统","version":"4.2强更","updated":"2026-10-23","source":"【4.2强更】妃子养成线.xlsx","summary":"单妃培养天命星，套系升级圣命星，属性收益落在关联勇士。","note":"评审建议，尚未写回原文档。技能效果与圣命星归属待系统确认；本文不将规则冲突直接判为确定错误。","items":[{"id":"astra-01","kind":"polish","group":"背景包装","title":"活动介绍改为面向玩家","sheet":"4.1文案需求","location":"D49","original":"D49：苍穹之上，群星交织成命。每一颗天命星，都蕴藏着不同的天赋与潜能。点亮星辰、连缀星轨，即可唤醒妃子的命格之力；点亮星石，还能为与她关联的勇士带来庇佑。当妃子相聚、华服生辉，圣命星也将愈发璀璨，为天命星赋予更强的祝福。","proposal":"群星闪耀，珍藏的星图正等待被唤醒。与妃子一同探寻星辰中的力量，逐步点亮星图，让她的天赋化作关联勇士的助力。当星石绽放光芒，更强的力量也将随之苏醒。星缘相连的妃子们，还将在各自的成长中彼此辉映，让圣命星的祝福愈加强盛。今夜，便与她共赴这场追寻星光的旅程。","reason":"原稿集中解释天命星、星轨、命格、星石和圣命星，信息偏内部方案摘要。展示文本应先建立画面与参与期待，具体规则由功能说明承接。","check":"","scope":"interface"},{"id":"astra-02","kind":"polish","group":"背景包装","title":"核心体验写清操作与收益","sheet":"4.1文案需求","location":"H49","original":"H49：逐步点亮星图，培养妃子的天赋；以星石增强关联勇士，并开启下一颗天命星的养成。通过妃子收集、套系升星和华服培养，推动圣命星升级。","proposal":"玩家为选定妃子消耗天命石和祝福石，逐级培养天命星中的技能，持续提升关联勇士属性。当前阶段技能全部满级后，可点亮星石，获得额外加成并解锁下一阶段，形成“技能升级—星石突破—下一阶段”的成长节奏。\n\n套系内妃子的收集、升星或皮肤培养达到对应条件后，可升级圣命星，放大本套系的天命星加成。玩家根据关联勇士的培养需求，选择优先投入的妃子与套系。","reason":"内部核心体验应描述玩家做什么、得到什么、如何继续。普通技能已提供勇士收益，不能把收益集中描述为“以星石增强”。","check":"涉及套系范围的表达，按同套系共享方案整理，待系统确认。","scope":"direction"},{"id":"astra-03","kind":"error","group":"概念定义","title":"星命收益对象写错","sheet":"4.1文案需求","location":"E56","original":"E56：以星辰为主题，通过培养天命星、提升圣命星等级，增强妃子的属性和成长效果。","proposal":"妃子的星辰养成系统，由天命星与圣命星两部分组成。培养天命星可提升关联勇士属性，提升圣命星等级可进一步强化对应套系的天命星加成。","reason":"详细规则将属性收益赋予关联勇士，原稿却写增强妃子属性，受益对象明确不符。","check":"","scope":"direction"},{"id":"astra-04","kind":"polish","group":"概念定义","title":"补齐天命星阶段关系","sheet":"4.1文案需求","location":"E57","original":"E57：每颗天命星对应一棵技能树，玩家可以培养其中的技能，获得不同加成。","proposal":"每位妃子拥有五颗依次解锁的天命星，每颗对应一幅独立星图。培养技能、点亮星石，可获得属性加成并推进后续阶段。","reason":"补清五阶段、独立星图及依次推进的关系，方便后续界面与引导共用。","check":"","scope":"direction"},{"id":"astra-05","kind":"polish","group":"概念定义","title":"明确星图是养成界面","sheet":"4.1文案需求","location":"E58","original":"E58：由星点和星轨组成的天命星养成图，展示技能节点与养成路线，并通过星点的明暗和等级表现养成进度。","proposal":"天命星的技能养成图，由技能节点、连接节点的星轨及最终星石组成。节点的解锁状态与等级共同展示培养进度。","reason":"概念说明需明确星图的身份，减少玩家将其理解为额外道具的可能。","check":"","scope":"direction"},{"id":"astra-06","kind":"ambiguity","group":"概念定义","title":"天命与祝福效果前后冲突","sheet":"4.1文案需求","location":"E59、E60","original":"E59：消耗对应妃子的天命石强化，提高该妃子对应属性的百分比加成。\nE60：消耗祝福石强化，提高妃子的对应属性成长率。","proposal":"天命技能：消耗对应妃子的天命石升级，提升该妃子关联勇士的单项属性成长率。\n祝福技能：消耗祝福石升级，提升该妃子关联勇士的单项属性百分比加成。","reason":"E59、E60与详细规则E177、E191相反，系统简介D71也存在相同冲突。不能仅靠润色决定最终效果。","check":"替换方案暂按详细规则编写；先由系统确认最终定义，再同步全表。","scope":"direction"},{"id":"astra-07","kind":"error","group":"概念定义","title":"命格收益对象写错","sheet":"4.1文案需求","location":"E61","original":"E61：同时消耗对应妃子的天命石和祝福石强化，提高该妃子的全属性成长率。","proposal":"同时消耗对应妃子的天命石和祝福石升级，提升该妃子关联勇士的全属性成长率。","reason":"原稿将全属性成长率写给妃子，与详细规则E205的受益对象不一致。","check":"","scope":"direction"},{"id":"astra-08","kind":"ambiguity","group":"概念定义","title":"星石遗漏收益与末阶段例外","sheet":"4.1文案需求","location":"E62","original":"E62：天命星的最终节点、下一颗天命星的养成开启条件","proposal":"每幅星图的最终节点。当前阶段所有技能满级后，可手动点亮，获得全属性成长率及百分比加成。若存在后续阶段，同时解锁下一颗天命星。","reason":"原稿只说明终点和解锁作用，未描述星石收益；最后一颗天命星也不存在下一阶段。","check":"","scope":"direction"},{"id":"astra-09","kind":"ambiguity","group":"概念定义","title":"圣命星与星缘归属待确认","sheet":"4.1文案需求","location":"E63、E65","original":"E63：每颗圣命星关联多个妃子套系，提升其等级，可以增强天命星提供的属性加成。\nE65：拥有共同主题的妃子组成一组星缘，代表她们之间的星辰缘分。多个星缘关联同一颗圣命星，提升套系总星级，可推进圣命星的升级条件。","proposal":"圣命星：同套系妃子共享的养成模块。提升其等级，可强化本套系天命技能、祝福技能、命格技能及星石提供的属性加成。\n星缘：妃子套系的星辰主题名称。同一星缘内的妃子共享圣命星等级，通过对应的收集或培养进度提升共同增益。","reason":"包装写多个套系或星缘关联一颗圣命星，详细规则D247强调同套系等级共享，二者关系不足以直接确定。","check":"按同套系共享提供候选文案；确认是一套系一颗，还是多个套系共用后定稿。","scope":"direction"},{"id":"astra-10","kind":"ambiguity","group":"概念定义","title":"三种升级条件需要分开说明","sheet":"4.1文案需求","location":"E64","original":"E64：妃子套系总星级、3D妃子皮肤总等级和已解锁妃子数量达到要求后，可提升圣命星等级。","proposal":"不同类型套系采用不同升级条件：普通妃子看套系妃子总星级，3D妃子看对应皮肤总等级，妃勇看套系内已解锁妃子数量。达到要求后，可手动升级。","reason":"原稿将三项条件用“和”并列，容易误读为同时满足；实际按角色类型分别采用。","check":"","scope":"direction"},{"id":"astra-11","kind":"polish","group":"道具说明","title":"明确专属材料的用途","sheet":"4.1文案需求","location":"E69","original":"E69：用于强化#妃子#的天命技能，也可与祝福石共同用于强化命格技能。","proposal":"用于提升#妃子#的天命技能等级，也可与祝福石共同用于提升其命格技能等级。","reason":"保留角色占位符，统一“升级技能等级”的功能措辞，与培养界面对应。","check":"","scope":"interface"},{"id":"astra-12","kind":"polish","group":"道具说明","title":"统一祝福石用途说明","sheet":"4.1文案需求","location":"E70","original":"E70：用于强化祝福技能，也可与对应妃子的天命石共同用于强化命格技能。","proposal":"用于提升祝福技能等级，也可与对应妃子的天命石共同用于提升命格技能等级。","reason":"交代两种用途，不额外承诺尚未确认的全妃通用范围。","check":"","scope":"interface"},{"id":"astra-13","kind":"ambiguity","group":"道具说明","title":"星石与消耗材料名称接近","sheet":"1.1潜能系统规则","location":"B31、B32、B33","original":"B31：星石\nB32：天命石\nB33：祝福石","proposal":"保留星石时，首次说明为“星图最终节点”，并在图标上区别于天命石和祝福石。如允许调整命名，可将最终节点改为“星核”。","reason":"三种名称均带“石”，但只有天命石和祝福石是消耗材料，容易混淆。改名属于可选优化。","check":"","scope":"interface"},{"id":"astra-14","kind":"ambiguity","group":"界面文本","title":"星命与潜能名称未同步","sheet":"2.1界面规则","location":"K304、K1015、K1016","original":"K304：潜能\nK1015：潜能\nK1016：潜能系统已开启，快去激发妃子的潜能吧！","proposal":"标题：星命\n开启提示：星命系统已开启！培养妃子星命，提升关联勇士属性。","reason":"包装确定为星命后，玩家入口与标题需一致；潜能可保留为内部功能概念。","check":"","scope":"interface"},{"id":"astra-15","kind":"error","group":"界面文本","title":"天命星阶段标题误写为圣命星","sheet":"2.1界面规则","location":"K362、K363、K364、K365","original":"K362：圣命星Ⅱ\nK363：圣命星Ⅲ\nK364：圣命星Ⅳ\nK365：圣命星Ⅴ","proposal":"K362：天命星Ⅱ\nK363：天命星Ⅲ\nK364：天命星Ⅳ\nK365：天命星Ⅴ","reason":"该区域展示天命星技能树阶段，使用另一模块名称属于明确的标题错误。","check":"","scope":"interface"},{"id":"astra-16","kind":"ambiguity","group":"界面文本","title":"技能点与技能等级混用","sheet":"2.1界面规则","location":"N549、P579、M560","original":"N549：#通用技能点图标#技能点#技能等级上限值#（max）\nP579：技能点icon 技能点\nM560：该技能点已提升至满级","proposal":"等级标签：技能等级\n满级状态：保留当前等级及上限参数，使用统一满级标记。\n提示：该技能已满级。","reason":"当前展示的是已培养等级，并不是待分配的技能点，术语需与功能一致。","check":"","scope":"interface"},{"id":"astra-17","kind":"ambiguity","group":"界面文本","title":"一键加点未说明操作范围","sheet":"2.1界面规则","location":"P635、P678、R692、R696","original":"P635：加点一次\nP678：一键加点\nR692：一键加点\nR696：*请确认是否将该技能提升至满级","proposal":"P635：升级\nP678、R692：升至满级\nR696：是否消耗以下材料，将当前技能升至满级？","reason":"现有功能只将选中的一个技能升满，“一键加点”可能让玩家以为会培养整棵树。","check":"","scope":"interface"},{"id":"astra-18","kind":"ambiguity","group":"界面文本","title":"星石奖励提示省略手动点亮","sheet":"2.1界面规则","location":"K468","original":"K468：点满所有技能，将获得大额属性加成","proposal":"本阶段技能满级后，可点亮星石，获得额外属性加成。","reason":"技能满级只是满足条件，仍需点击点亮。提示应反映完整操作顺序。","check":"","scope":"interface"},{"id":"astra-19","kind":"polish","group":"界面文本","title":"未达点亮条件提示说明下一步","sheet":"2.1界面规则","location":"N747","original":"N747：未将所有技能点满，点亮失败","proposal":"请先将本阶段所有技能升至满级。","reason":"比“点亮失败”更有帮助，直接告诉玩家需要补足的条件。","check":"","scope":"interface"},{"id":"astra-20","kind":"polish","group":"界面文本","title":"已点亮状态反馈阶段完成","sheet":"2.1界面规则","location":"N766","original":"N766：该阶段所有技能已提升至满级","proposal":"星石已点亮，本阶段培养完成。","reason":"该文本用于已点亮状态，应明确当前阶段已经完成。","check":"","scope":"interface"},{"id":"astra-21","kind":"ambiguity","group":"界面文本","title":"圣命星效果缺少作用范围","sheet":"2.1界面规则","location":"K811、N847","original":"K811：提升圣命星的等级可以强化天命星效果\nN847：天命星效果","proposal":"K811：提升圣命星等级，强化本套系的天命星属性加成。\nN847：天命星加成增幅。","reason":"说明作用范围，并区分对已有加成的放大与直接增加属性。","check":"先确认套系归属及放大公式；当前建议按同套系共享方案编写。","scope":"interface"},{"id":"astra-22","kind":"ambiguity","group":"界面文本","title":"升级进度缺少统计范围","sheet":"2.1界面规则","location":"L946、L947、L948","original":"L946：累计妃子星级：#已达成#/#要求#\nL947：累计皮肤等级：#已达成#/#要求#\nL948：累计妃子数量：#已达成#/#要求#","proposal":"L946：本套系妃子总星级：#已达成#/#要求#\nL947：皮肤总等级：#已达成#/#要求#\nL948：本套系已拥有妃子：#已达成#/#要求#","reason":"原文“累计”容易被理解为全账号总量或历史累积；应说明当前统计范围。","check":"","scope":"interface"},{"id":"astra-23","kind":"polish","group":"界面文本","title":"升级条件提示精简","sheet":"2.1界面规则","location":"N974","original":"N974：当前不满足升级条件，升级失败","proposal":"尚未满足升级条件。","reason":"删除没有额外信息的“升级失败”。具体缺口由页面条件区承接。","check":"","scope":"interface"},{"id":"astra-24","kind":"error","group":"界面文本","title":"属性来源残留图腾名称及错误参数","sheet":"2.1界面规则","location":"O987、O992、O997、O1002","original":"O987：图腾加成：#n1#\nO992：图腾加成：#n1#\nO997：图腾加成：#n1#\nO1002：图腾加成：#n1#","proposal":"星命加成：#n1#\n星命加成：#n2#\n星命加成：#n3#\n星命加成：#n4#\n同步对应K列中的“潜能加成”名称。","reason":"润色栏残留其他系统的“图腾加成”，且四项均写n1；应恢复各属性对应参数。","check":"","scope":"interface"},{"id":"astra-25","kind":"polish","group":"剧情引导","title":"通用角色避免强加祖母背景","sheet":"4.1文案需求","location":"G82","original":"G82：可汗，您来得正好！小时候，祖母总指着星空说，每个人都有属于自己的天命星。我找了好久，终于寻到了这幅星图。","proposal":"可汗，您来得正好！听说群星藏着人们尚未发现的力量。我找了好久，终于寻到了这幅星图。","reason":"通用出演不宜给所有妃子统一添加相同的祖母传说；同时避免“一人一颗星”的限定。","check":"","scope":"story"},{"id":"astra-26","kind":"ambiguity","group":"剧情引导","title":"寻找星辰与培养过程衔接","sheet":"4.1文案需求","location":"G84","original":"G84：还没有呢。不过据说，沿着星图找到自己的天命星，就能唤醒相应的星石，得到星辰的庇佑。您愿意陪我一起找吗？","proposal":"还没有呢。图上说，要沿着星轨慢慢唤醒其中的力量，直到星石亮起。可这漫天的星星，我一个人恐怕要找上许久……您愿意陪我吗？","reason":"原稿容易表达为找到天命星便能唤醒星石，需要补出逐步培养的过程，并保留邀请陪伴的情绪。","check":"","scope":"story"},{"id":"astra-27","kind":"polish","group":"剧情引导","title":"避免剧情先限定未确认的归属","sheet":"4.1文案需求","location":"G85","original":"G85：当然。只是这图上，有些星辰连在一起，又都围着一颗大星，这是为什么？","proposal":"当然。不过，这些彼此相连的星辰，又有什么特别之处？","reason":"不预设所有星辰围绕同一颗圣命星，保留对星缘的自然提问。","check":"","scope":"story"},{"id":"astra-28","kind":"ambiguity","group":"剧情引导","title":"同心表述容易暗示亲密度条件","sheet":"4.1文案需求","location":"G86","original":"G86：那便是“星缘”，就像因缘相聚的姐妹们。中央的是圣命星，祖母说，相伴的人越是同心，它的光芒就越明亮，照看着彼此的天命星。","proposal":"那是星缘。星轨相连的人，各自的成长都能让圣命星更加明亮，再由它辉映彼此的天命星。就像有人相伴，前面的路也会亮一些。","reason":"用各自成长承接养成条件，保留相伴的情感，避免把“同心”误读为功能条件。","check":"圣命星归属确认后，再核对该句与实际作用范围。","scope":"story"},{"id":"astra-29","kind":"error","group":"剧情引导","title":"第三人称动作误放角色对白","sheet":"4.1文案需求","location":"E88、F88、G88","original":"E88：对话样式\nF88：本期投放妃子\nG88：她笑着挪开身旁的软垫，为你让出位置。帐外群星闪烁，桌上的星石也悄然映出一缕微光。","proposal":"E88、F88改为：旁白。\nG88原文保留。","reason":"“她笑着挪开……”是动作叙述，当前却标为角色对白，不应由妃子直接说出。","check":"","scope":"story"},{"id":"astra-30","kind":"ambiguity","group":"剧情引导","title":"系统首次引导与促销首次引导混用","sheet":"4.1文案需求","location":"B79","original":"B79：【首次进入活动播放剧情对话】","proposal":"若用于常驻系统：首次进入星命系统时播放。\n若用于促销活动：首次进入本期促销活动时播放，并调整“初次发现星图”的设定。","reason":"常驻系统与每期促销的触发频率不同，必须先确认，避免每期重复首次发现的剧情。","check":"","scope":"story"},{"id":"astra-31","kind":"error","group":"规则同步","title":"名词表技能名称复制残留","sheet":"1.1潜能系统规则","location":"B29、D28、D29、D30","original":"B29：圣命技能\nD28：提升命格技能等级提供属性成长率加成\nD29：提升命格技能等级提供属性百分比加成\nD30：提升命格技能等级提供全属性加成","proposal":"B29：祝福技能。\nD28：提升天命技能等级，提供关联勇士单项属性成长率加成。\nD29：提升祝福技能等级，提供关联勇士单项属性百分比加成。\nD30：提升命格技能等级，提供关联勇士全属性成长率加成。","reason":"B29使用未定义的“圣命技能”，说明栏连续复制“命格技能”；技能效果仍需与最终功能定义一起同步。","check":"","scope":"interface"},{"id":"astra-32","kind":"ambiguity","group":"规则同步","title":"系统简介与详细规则效果相反","sheet":"1.1潜能系统规则","location":"D71","original":"D71：天命技能提供属性百分比加成，祝福技能提供属性成长率加成，命格技能提供全属性成长率加成","proposal":"天命技能提供关联勇士单项属性成长率加成，祝福技能提供单项属性百分比加成，命格技能提供全属性成长率加成。","reason":"简介与详细规则定义相反，需要功能负责人确定权威定义，避免后续翻译、配置继续复用冲突内容。","check":"当前替换暂按E177、E191、E205；未经确认不视为最终规则。","scope":"interface"},{"id":"astra-33","kind":"ambiguity","scope":"story","group":"剧情引导","title":"“本期投放妃子”需明确具体配置对象","sheet":"4.1文案需求","location":"F82、F84、F86","original":"F82：本期投放妃子\nF84：本期投放妃子\nF86：本期投放妃子","proposal":"通用剧情稿可使用“本期投放妃子”作为角色占位说明；正式配置前，需明确本期实际使用的妃子名称、角色ID及对应立绘资源。\nF82、F84、F86统一绑定同一位指定妃子。若剧情随每期促销复用，应由每期投放配置明确绑定；若仅用于系统首次引导，应明确固定出演妃子。\n可汗台词继续使用玩家角色配置，G81、G88按旁白配置，不归入妃子对白。","reason":"“本期投放妃子”只说明角色选取方向，没有指明可直接落表的具体对象。明确具体角色及绑定方式，才能统一配置发言人、立绘和展示名称，避免配置人员自行猜测，也便于后续各期复用。","check":"需系统／文案确认实际出演妃子，以及固定出演还是按每期投放绑定；角色ID沿用项目正式配置，不在评审中自行编造。"}],"drafts":[{"id":"intro","title":"活动介绍","audience":"玩家展示","sheet":"4.1文案需求","location":"D49","original":"苍穹之上，群星交织成命。每一颗天命星，都蕴藏着不同的天赋与潜能。点亮星辰、连缀星轨，即可唤醒妃子的命格之力；点亮星石，还能为与她关联的勇士带来庇佑。当妃子相聚、华服生辉，圣命星也将愈发璀璨，为天命星赋予更强的祝福。","text":"群星闪耀，珍藏的星图正等待被唤醒。与妃子一同探寻星辰中的力量，逐步点亮星图，让她的天赋化作关联勇士的助力。当星石绽放光芒，更强的力量也将随之苏醒。星缘相连的妃子们，还将在各自的成长中彼此辉映，让圣命星的祝福愈加强盛。今夜，便与她共赴这场追寻星光的旅程。","reason":"减少概念堆叠，突出星辰探索、相伴成长与勇士受益。","scope":"interface"},{"id":"core","title":"核心体验","audience":"内部评审","sheet":"4.1文案需求","location":"H49","original":"逐步点亮星图，培养妃子的天赋；以星石增强关联勇士，并开启下一颗天命星的养成。通过妃子收集、套系升星和华服培养，推动圣命星升级。","text":"玩家为选定妃子消耗天命石和祝福石，逐级培养天命星中的技能，持续提升关联勇士属性。当前阶段技能全部满级后，可点亮星石，获得额外加成并解锁下一阶段，形成“技能升级—星石突破—下一阶段”的成长节奏。\n\n套系内妃子的收集、升星或皮肤培养达到对应条件后，可升级圣命星，放大本套系的天命星加成。玩家根据关联勇士的培养需求，选择优先投入的妃子与套系。","reason":"按操作、收益和下一步目标描述功能，不将非主力妃子培养写成已达成效果。","scope":"direction"}],"story":[{"location":"G81","speaker":"旁白","text":"夜色笼罩草原，王帐中却仍亮着灯火。你循着灯光走近，只见妃子正将一幅星图铺在桌上，图角还压着几颗晶莹的石头。","changed":false},{"location":"G82","speaker":"本期投放妃子","text":"可汗，您来得正好！听说群星藏着人们尚未发现的力量。我找了好久，终于寻到了这幅星图。","changed":true},{"location":"G83","speaker":"{可汗昵称}","text":"难怪这几晚都见你望着天上。怎么样，找到自己的那颗星了吗？","changed":false},{"location":"G84","speaker":"本期投放妃子","text":"还没有呢。图上说，要沿着星轨慢慢唤醒其中的力量，直到星石亮起。可这漫天的星星，我一个人恐怕要找上许久……您愿意陪我吗？","changed":true},{"location":"G85","speaker":"{可汗昵称}","text":"当然。不过，这些彼此相连的星辰，又有什么特别之处？","changed":true},{"location":"G86","speaker":"本期投放妃子","text":"那是星缘。星轨相连的人，各自的成长都能让圣命星更加明亮，再由它辉映彼此的天命星。就像有人相伴，前面的路也会亮一些。","changed":true},{"location":"G87","speaker":"{可汗昵称}","text":"那明晚便邀大家一起来。今夜，先让我陪你找找——总不能让你的那颗星等得太久。","changed":false},{"location":"G88","speaker":"旁白","text":"她笑着挪开身旁的软垫，为你让出位置。帐外群星闪烁，桌上的星石也悄然映出一缕微光。","changed":true}]}]}</script>

<script>
'use strict';
const base=JSON.parse(document.getElementById('review-data').textContent);
const labels={error:'明确错误',ambiguity:'概念歧义',polish:'表达优化'};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const projects=base.projects;let activeId=projects[0]?.id,kind='all',tab='direction',query='';
function project(){return projects.find(p=>p.id===activeId)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),2200)}
async function copy(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const el=document.createElement('textarea');el.value=text;el.style.position='fixed';el.style.left='-10000px';document.body.append(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw Error('copy')}toast('已复制')}catch(e){toast('复制受限，请选中文本手动复制')}}
function render(){const p=project();$('projectName').textContent=p?.name||'文案包装校对';document.title=(p?.name?p.name+' · ':'')+'GOK文案包装校对';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('reviewPanel').classList.remove('hidden');$('draftsPanel').classList.toggle('hidden',tab==='story');$('storyPanel').classList.toggle('hidden',tab!=='story');renderReviews(p);renderDrafts(p);renderStory(p)}
function renderReviews(p){const all=(p?.items||[]).filter(i=>i.scope===tab);$('filters').innerHTML=[['all','全部'],...Object.entries(labels)].map(([k,l])=>`<button class="chip ${kind===k?'active':''}" data-kind="${k}" aria-pressed="${kind===k}">${l}<span class="count">${k==='all'?all.length:all.filter(i=>i.kind===k).length}</span></button>`).join('');const q=query.trim().toLowerCase();const rows=all.filter(i=>(kind==='all'||i.kind===kind)&&(!q||[i.title,i.sheet,i.location,i.original,i.proposal,i.reason,i.check,i.group].join(' ').toLowerCase().includes(q)));$('resultCount').textContent=`${rows.length} / ${all.length} 条建议`;$('cards').innerHTML=rows.length?rows.map(i=>`<article class="review ${esc(i.kind)}"><div class="cardhead"><div><div class="titleline"><span class="badge">${labels[i.kind]}</span><h3>${esc(i.title)}</h3></div><div class="loc">${esc(i.sheet)}<span class="cell">${esc(i.location)}</span> · ${esc(i.group||'评审')}</div></div><button class="copy" data-copy-item="${esc(i.id)}">复制方案</button></div><div class="comparison"><div class="col original"><div class="label">文档原文</div><div class="copytext">${esc(i.original)}</div></div><div class="col proposal"><div class="label">建议替换 / 处理方案</div><div class="copytext">${esc(i.proposal)}</div></div></div><div class="reason"><strong>修改理由</strong>${esc(i.reason)}</div>${i.check?`<div class="pending"><b>待确认</b>　${esc(i.check)}</div>`:''}</article>`).join(''):`<div class="empty"><strong>${all.length?'没有匹配的建议':'还没有录入评审'}</strong>${all.length?'试试其他关键词或问题类别。':''}</div>`;}
function renderDrafts(p){$('draftsPanel').innerHTML=(p?.drafts||[]).filter(d=>d.scope===tab).length?p.drafts.filter(d=>d.scope===tab).map(d=>`<article class="draft"><div class="drafttop"><div class="titleline"><h2>${esc(d.title)}</h2><span class="audience">${esc(d.audience)}</span></div><button class="copy" data-copy-draft="${esc(d.id)}">复制全文</button></div><div class="loc">${esc(d.sheet)}<span class="cell">${esc(d.location)}</span></div><div class="finaltext">${esc(d.text)}</div><p class="rationale"><b>修改理由：</b>${esc(d.reason)}</p><details><summary>对照文档原文</summary><p>${esc(d.original)}</p></details></article>`).join(''):''}
function renderStory(p){$('storyPanel').innerHTML=(p?.story||[]).length?`<article class="draft"><div class="drafttop"><h2>开场剧情 · 建议版</h2><button class="copy" id="copyStory">复制完整剧情</button></div><p class="rationale">保留夜访王帐、相伴观星的氛围；调整机制误解和对白归属。原文及理由见上方对应条目。</p>${p.story.map(s=>`<div class="storyrow"><div class="speaker">${esc(s.location)}<b>${esc(s.speaker)}</b>${s.changed?'<span class="changed">已调整</span>':'<span class="changed">保留原文</span>'}</div><div class="storytext">${esc(s.text)}</div></div>`).join('')}</article>`:'<div class="empty"><strong>暂无剧情方案</strong></div>'}

$('projectSelect').innerHTML=projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.type)}</option>`).join('');
$('projectSelect').addEventListener('change',e=>{activeId=e.target.value;query='';$('search').value='';kind='all';render()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;kind='all';query='';$('search').value='';render()}});
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(b){kind=b.dataset.kind;renderReviews(project())}});
$('search').addEventListener('input',e=>{query=e.target.value;renderReviews(project())});
$('cards').addEventListener('click',e=>{const b=e.target.closest('[data-copy-item]');if(b){const i=project()?.items.find(x=>x.id===b.dataset.copyItem);if(i)copy(i.proposal)}});
$('draftsPanel').addEventListener('click',e=>{const b=e.target.closest('[data-copy-draft]');if(b){const d=project()?.drafts?.find(x=>x.id===b.dataset.copyDraft);if(d)copy(d.text)}});
$('storyPanel').addEventListener('click',e=>{if(e.target.closest('#copyStory'))copy(project().story.map(s=>s.speaker+'：'+s.text).join('\n\n'))});
render();
</script>
</body></html>
