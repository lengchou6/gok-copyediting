","scope":"story","highlights":[],"priority":"可选","usage":"剧情展示","replacements":[{"cell":"G86","text":"那是星缘。星轨相连的人，各自的成长都能让圣命星更加明亮，再由它辉映彼此的天命星。就像有人相伴，前面的路也会亮一些。","sheet":"4.1文案需求","original":"那便是“星缘”，就像因缘相聚的姐妹们。中央的是圣命星，祖母说，相伴的人越是同心，它的光芒就越明亮，照看着彼此的天命星。"}],"actionNote":"原句的情感表达可以保留，此项不属于机制错误。","originals":[{"sheet":"4.1文案需求","cell":"G86","text":"那便是“星缘”，就像因缘相聚的姐妹们。中央的是圣命星，祖母说，相伴的人越是同心，它的光芒就越明亮，照看着彼此的天命星。"}]},{"id":"astra-29","kind":"error","group":"剧情引导","title":"第三人称动作误放角色对白","sheet":"4.1文案需求","location":"E88、F88","original":"E88：对话样式\nF88：本期投放妃子","proposal":"E88、F88改为：旁白。\nG88原文保留。","reason":"“她笑着挪开……”是动作叙述，当前却标为角色对白，不应由妃子直接说出。","check":"","scope":"story","highlights":[],"handling":true,"priority":"必改","usage":"剧情展示","replacements":[{"cell":"E88","text":"旁白","sheet":"4.1文案需求","original":"对话样式"},{"cell":"F88","text":"旁白","sheet":"4.1文案需求","original":"本期投放妃子"}],"actionNote":"G88保留原文，仅调整E88、F88的样式与角色。","originals":[{"sheet":"4.1文案需求","cell":"E88","text":"对话样式"},{"sheet":"4.1文案需求","cell":"F88","text":"本期投放妃子"}]},{"id":"astra-30","kind":"ambiguity","group":"引导配置","title":"系统首次引导与促销首次引导混用","sheet":"4.1文案需求","location":"B79","original":"B79：【首次进入活动播放剧情对话】","proposal":"若用于常驻系统：首次进入星命系统时播放。\n若用于促销活动：首次进入本期促销活动时播放，并调整“初次发现星图”的设定。","reason":"常驻系统与每期促销的触发频率不同，必须先确认，避免每期重复首次发现的剧情。","check":"需系统确认剧情触发是账号首次一次，还是每期活动首次一次，再使用对应文本。","scope":"story","highlights":[],"handling":true,"priority":"确认后修改","usage":"需系统确认的引导配置","replacements":[],"alternatives":[{"title":"方案A：系统首次引导","condition":"若仅在玩家首次进入星命系统时播放。","replacements":[{"cell":"B79","text":"首次进入星命系统时播放剧情对话，仅播放一次。","sheet":"4.1文案需求","original":"【首次进入活动播放剧情对话】"}]},{"title":"方案B：每期促销引导","condition":"若每期活动首次进入时播放。","replacements":[{"cell":"B79","text":"首次进入本期星命促销活动时播放剧情对话，每期仅播放一次。","sheet":"4.1文案需求","original":"【首次进入活动播放剧情对话】"}]}],"actionNote":"若采用方案B，复用剧情时需避免每期都重复“首次发现星图”的情境。","originals":[{"sheet":"4.1文案需求","cell":"B79","text":"【首次进入活动播放剧情对话】"}]},{"id":"astra-31","kind":"error","group":"属性与术语","title":"名词表误写未定义的技能名称","sheet":"1.1潜能系统 "群星闪耀，珍藏的星图正等待被唤醒。与妃子一同探寻星辰中的力量，逐步点亮星图，让她的天赋化作关联勇士的助力。当星石绽放光芒，更强的力量也将随之苏醒。星缘相连的妃子们，还将在各自的成长中彼此辉映，让圣命星的祝福愈加强盛。今夜，便与她共赴这场追寻星光的旅程。","reason":"减少概念堆叠，突出星辰探索、相伴成长与勇士受益。","scope":"interface"},{"id":"core","title":"核心体验","audience":"内部评审","sheet":"4.1文案需求","location":"H49","original":"逐步点亮星图，培养妃子的天赋；以星石增强关联勇士，并开启下一颗天命星的养成。通过妃子收集、套系升星和华服培养，推动圣命星升级。","text":"玩家为选定妃子消耗天命石和祝福石，逐级培养天命星中的技能，持续提升关联勇士属性。当前阶段技能全部满级后，可点亮星石，获得额外加成并解锁下一阶段，形成“技能升级—星石突破—下一阶段”的成长节奏。\n\n套系内妃子的收集、升星或皮肤培养达到对应条件后，可升级圣命星，放大本套系的天命星加成。玩家根据关联勇士的培养需求，选择优先投入的妃子与套系。","reason":"按操作、收益和下一步目标描述功能，不将非主力妃子培养写成已达成效果。","scope":"direction"}],"story":[{"location":"G81","speaker":"旁白","text":"夜色笼罩草原，王帐中却仍亮着灯火。你循着灯光走近，只见妃子正将一幅星图铺在桌上，图角还压着几颗晶莹的石头。","changed":false,"original":"夜色笼罩草原，王帐中却仍亮着灯火。你循着灯光走近，只见妃子正将一幅星图铺在桌上，图角还压着几颗晶莹的石头。","originalSpeaker":"旁白","reviewIds":[],"contextNote":""},{"location":"G82","speaker":"本期投放妃子","text":"可汗，您来得正好！听说群星藏着人们尚未发现的力量。我找了好久，终于寻到了这幅星图。","changed":true,"original":"可汗，您来得正好！小时候，祖母总指着星空说，每个人都有属于自己的天命星。我找了好久，终于寻到了这幅星图。","originalSpeaker":"本期投放妃子","reviewIds":["astra-25"],"contextNote":"后接可汗询问“找到自己的那颗星了吗”；“寻到星图”与“尚未找到星辰”仍能衔接。"},{"location":"G83","speaker":"{可汗昵称}","text":"难怪这几晚都见你望着天上。怎么样，找到自己的那颗星了吗？","changed":false,"original":"难怪这几晚都见你望着天上。怎么样，找到自己的那颗星了吗？","originalSpeaker":"{可汗昵称}","reviewIds":[],"contextNote":""},{"location":"G84","speaker":"本期投放妃子","text":"还没有呢。图上说，要沿着星轨慢慢唤醒其中的力量，直到星石亮起。可这漫天的星星，我一个人恐怕要找上许久……您愿意陪我吗？","changed":true,"original":"还没有呢。不过据说，沿着星图找到自己的天命星，就能唤醒相应的星石，得到星辰的庇佑。您愿意陪我一起找吗？","originalSpeaker":"本期投放妃子","reviewIds":["astra-26"],"contextNote":"回应上一句“找到了吗”，再邀请可汗陪伴；下一句“当然”能够自然接住邀请。"},{"location":"G85","speaker":"{可汗昵称}","text":"当然。不过，这些彼此相连的星辰，又有什么特别之处？","changed":true,"original":"当然。只是这图上，有些星辰连在一起，又都围着一颗大星，这是为什么？","originalSpeaker":"{可汗昵称}","reviewIds":["astra-27"],"contextNote":"先答应陪伴，再提问星缘，为下一句解释保留明确话题。"},{"location":"G86","speaker":"本期投放妃子","text":"那是星缘。星轨相连的人，各自的成长都能让圣命星更加明亮，再由它辉映彼此的天命星。就像有人相伴，前面的路也会亮一些。","changed":true,"original":"那便是“星缘”，就像因缘相聚的姐妹们。中央的是圣命星，祖母说，相伴的人越是同心，它 忆\n完整收藏物：春游留影\n收藏物碎片：留影碎片\n图鉴：春游画册\n消耗道具：闲游令\n操作按钮：闲游一次／闲游十次\n积分与倍率：保留闲趣积分、闲趣加成。\n\n“闪卡”保留为内部策划称谓。若最终美术更偏古典绘画，可备选“春游绘卷／绘卷碎片”，作为另一整套命名取舍，不与留影方案混用。","reason":"“闪卡”容易使玩家期待镭射、闪光或动态卡面，现有需求未明确这些表现。“春游拾忆—春游留影—春游画册”分别对应玩法、收藏物与图鉴，形成可理解的收集关系。留影可通过插画或画卷呈现，无需引入摄影设定。","check":"先核对与现有道具及系统的重名情况，再确认采用。统一同步入口、奖池预览、奖励名称、收集说明、图鉴、剧情和本地化术语，不直接更改配置KEY。","kind":"polish","priority":"可选","usage":"内部设计说明","highlights":[],"replacements":[],"handling":true},{"id":"ranking-24","scope":"interface","group":"介绍与说明","title":"闲游首屏明确消耗、随机奖励与集齐收益","sheet":"文案包装","location":"E64（新增抽取说明建议）","original":"E64：将妃子春游中的不同片刻呈现在闪卡中。玩家通过抽取闪卡、收集碎片与合成卡片，收集春日游赏画面，并获得闲趣积分与闲趣加成。","proposal":"建议抽取页首屏说明：\n消耗闲游令进行闲游，随机获得留影碎片或道具。集齐一张春游留影，可获得闲趣加成，提升盛典竞榜积分。\n\n入口采用“春游拾忆”；按钮采用“闲游一次／闲游十次”，在按钮旁明确展示对应道具图标与消耗数量。","reason":"入口名负责春游氛围，说明文本负责讲清消耗、随机抽取和集齐收益。仅写“闲游收集”不足以让玩家知道实际操作和付费道具用途。","check":"文案按最终命名与界面容量调整。消耗数量读取配置，不将示例数值写死；需UI确认现有控件承载方式。","kind":"polish","priority":"可选","usage":"玩家展示","highlights":[],"replacements":[],"handling":true},{"id":"ranking-25","scope":"direction","group":"概念关系","title":"地图表现不承诺额外探索与剧情","sheet":"系统规则","location":"D162、E212","original":"D162：每一次会在当前阶段的几个目的地中随机挑选一个地点进行闲游\nE212：消耗#1#个【闲游令】可以进行#1#次闲游，从当前地图上随机挑选一个目的地闲游","proposal":"地图用于表现随机闲游地点及抽取结果，包装突出“闲游带回春日珍藏”。当前不增加“自由选择地点”“探索专属事件”“邂逅专属故事”等承诺。\n不同地点若仅有表现差异，不暗示其拥有不同奖励或概率；如后续确有玩法差异，再补齐对应说明。","reason":"现有规则是随机选择目的地并获得奖励，未定义路线决策、探索事件或地点剧情。文案应使玩家的预期与实际抽取操作一致。","check":"本建议不要求新增探索或剧情功能；新增功能必须另行立项确认，剧情仍受既有开发前提约束。","kind":"polish","priority":"可选","usage":"内部设计说明","highlights":[],"replacements":[],"handling":true},{"id":"ranking-26","scope":"interface","group":"收集反馈","title":"新碎片与整张留影完成区分反馈","sheet":"系统规则","location":"E177、E178（反馈表现建议）","original":"E177：每获取一张未拥有的闪卡碎片，将获得#N#点闲趣值\nE178：收集闪卡碎片，若闪卡碎片能够构成一张完整的闪卡，则可以获得闲趣加成#M#%，仅可获得1次","proposal":"新碎片：突出“新获得”，并展示对应春游留影的收集进度。\n整张完成：展示完整插画，明确提示“春游留影已集齐”及本次获得的闲趣加成。\n重复碎片：明确显示已转化为闲趣积分，避免误认为碎片丢失。\n\n以“逐步补齐春游画面”建立收集体验；无需为留影名称额外增加摄影、探索或剧情功能。","reason":"新碎片、集齐整张和重复转化是不同结果，应提供不同反馈。完整画面与加成同时出现，可将情感收藏与冲榜收益对应起来。","check":"收集进度、完 nservative":[{"location":"G86","speaker":"旁白","text":"王庭盛典即将开启，各地贵族与妃子纷纷前往王庭，共赴这场一年一度的春日盛会。春风拂过草原，花海映着湖光，一场融合春日闲趣与荣誉竞逐的盛典即将拉开序幕"},{"location":"G87","speaker":"本期投放妃子","text":"可汗！王庭盛典的筹备已经完成啦！大家都准备好好游赏一番，还有不少人想在竞榜中争个好名次呢。"},{"location":"G88","speaker":"{可汗昵称}","text":"哈哈！既是王庭盛典，自然不能只有赏花游湖，也得分出个高下！"},{"location":"G89","speaker":"本期投放妃子","text":"可不是嘛，可汗！这次盛典一共有四轮竞逐，闲游收集、完成游园事务、积累名望，都能获得盛典积分，还有机会一路晋阶，争夺最后的荣耀呢！"},{"location":"G90","speaker":"{可汗昵称}","text":"四轮竞逐？听起来倒是有趣。那可得好好表现一番了！"},{"location":"G91","speaker":"本期投放妃子","text":"那是当然啦！大家可都摩拳擦掌呢，可汗也要加把劲，千万别被别人抢了风头呀！"},{"location":"G92","speaker":"{可汗昵称}","text":"哈哈！那就传令下去，王庭盛典正式开启！这场盛典的头名，我势在必得！"},{"location":"G93","speaker":"旁白","text":"春色正好，盛会已至。四轮竞逐，谁能脱颖而出，赢得最终荣耀？王庭盛典，正式拉开序幕！"}],"storyConservativeNote":"仅在确认新增剧情播放功能并纳入开发排期后，才进入正式剧情配置。保守版保留原句；随后需确认本期出演妃子和首次播放范围。若不开发，改由现有活动引导弹窗承载背景介绍，以下对白仅作备用参考。","storyPolishNote":"本稿以本期新增剧情播放功能为前提，当前仅作可选润色参考，不代表已具备播放能力。沿用原有8句与角色顺序，调整春游陪伴、积分途径及竞榜衔接；功能开发确认后，再由文案与系统评审采用。"},{"id":"peak-war","name":"巅峰盟战","type":"活动","version":"待排期","updated":"2026-10-26","source":"【待排期】巅峰盟战_执行文档(1).xlsx","summary":"沿用盟战攻城对抗，加入分段晋级、指挥营备战与个人、联盟双线荣誉。","note":"仅保留影响理解或配置的文案问题。连胜沿用最高段位保级计数的既有定义；排序表述核对不视为玩法错误，可选包装不作必改。","items":[{"id":"peak-01","scope":"interface","group":"介绍与说明","title":"活动介绍突出晋级与双线荣誉","sheet":"文案需求","location":"D49","original":"文案需求 · D49：联盟争霸开启以来，各大联盟历经无数战斗，在荣耀与挑战中不断成长。一次次争锋，诞生了无数强者，也留下了无数传奇。如今，普通的较量已无法满足真正的强者，一场汇聚天下顶尖联盟的巅峰对决即将拉开序幕。","originals":[{"sheet":"文案需求","cell":"D49","text":"联盟争霸开启以来，各大联盟历经无数战斗，在荣耀与挑战中不断成长。一次次争锋，诞生了无数强者，也留下了无数传奇。如今，普通的较量已无法满足真正的强者，一场汇聚天下顶尖联盟的巅峰对决即将拉开序幕。"}],"proposal":"战鼓再起，各大联盟整军集结，共赴巅峰之争。与盟友并肩征战，攻占城池、争夺王城，在一场场较量中向王者段位进军。备战积威，临阵扬名，既为联盟争取更高荣誉，也以个人战绩角逐巅峰榜。待赛季战尘落定，巅峰联盟将入驻王帐，让胜利的旗帜迎风高扬。","reason":"原介绍连续重复强者、传奇和荣耀，作为活动介绍可适度压缩，并点出晋级与个人、联盟荣誉。属于可选表达优化，原稿并非功能错误。","kind":"polish","priority":"可选","check":"","usage":"玩家展示","highlights":[],"replacements":[{"sheet":"文案需求","cell":"D49","original":"联盟争霸开启以来，各大联盟历经无数战斗，在荣耀与挑战中不断成长。一次次争锋，诞生了无数强者，也留下了无数传奇。如今，普通的较量已无法满足真正的强者，一场汇聚天下顶尖联盟的巅峰对决即将拉开序幕。","text":"战鼓再起，各大联盟整军集结，共赴巅峰之争。与盟友并肩征战，攻占城池、争夺王城，在一场场较量中向王者段位进军。备战积威，临阵扬名，既为联盟争取更高荣誉，也以个人战绩角逐巅峰榜。待赛季战尘落定，巅峰联盟将入驻王帐，让胜利的旗帜迎风高扬。"}],"handling":false,"lengthNote":"116字（含标点）；原表介绍栏要求100—150字。"},{"id":"peak-04","scope":"direction","group":"概念关系","title":"王帐评选的指标主次需明确","sheet":"1.系统概述 / 2.一级界面 / 文案需求","location":"E794、I381、E70","original":"1.系统概述 · E794：入驻规则：巅峰战最后一场战斗结束后入驻，每个赛区的累计连胜次数最多且联盟赛季积分第一的联盟入驻\n2.一级界面 · I381：当存在当前最高段位，且累计连胜最多且赛季联盟积分第一的联盟\n文案需求 · E70：巅峰战最后一场战斗结束后入驻，每个赛区的累计连胜次数最多且联盟赛季积分第一的联盟入驻","originals":[{"sheet":"1.系统概述","cell":"E794","text":"入驻规则：巅峰战最后一场战斗结束后入驻，每个赛区的累计连胜次数最多且联盟赛季积分第一的联盟入驻"},{"sheet":"2.一级界面","cell":"I381","text":"当存在当前最高段位，且累计连胜最多且赛季联盟积分第一的联盟"},{"sheet":"文案需求","cell":"E70","text":"巅峰战最后一场战斗结束后入驻，每个赛区的累计连胜次数最多且联盟赛季积分第一的联盟入驻"}],"proposal":"现文档的“累计连胜次数最多且赛季联盟积分第一”可能是排序规则的简写。核对是否为“先比较累计连胜次数，次数相同时再比较赛季积分”；若是，直接将主次关系写清，不改动既定评选方式。","reason":"此项只核对两项指标的比较顺序，不判定玩法无法选出冠军，也不要求更换“最强联盟”称呼。","kind":"ambiguity","priority":"确认后修改","check":"确认现有设计的排序主次及同分处理，按实际规则补充表述，不另行设计评选方案。","usage":"内部设计说明","highlights":[],"replacements":[],"handling":true,"analysis":{"summary":"两项指标均已列出，尚需明确“且”表示主次排序，还是同时满足的条件。","headers":["联盟","累计连胜次数","赛季积分"],"rows":[["A盟","3次","8,000"],["B盟","2次","10,000"]],"caption":"若次数优先则A盟领先；若两项均要求第一，则没有联盟同时满足。此例用于说明两种理解的差别。","recommendation":"先核对既定排序。若为次数优先、积分次之，仅补清“次数相同再比积分”的关系；若另有规则，则按实际判定说明。","reference":{"condition":"仅在确认次数优先、积分次之后采用","text":"按本赛季累计连胜次数排名，次数相同时，赛季联盟积分较高的联盟优先。"}}},{"id":"peak-07","scope":"interface","group":"介绍与说明","title":"初始段位弹窗标题写成掉段","sheet":"2.一级界面","location":"O2390","original":"2.一级界面 · O2390：掉段","originals":[{"sheet":"2.一级界面","cell":"O2390","text":"掉段"}],"proposal":"初始段位","reason":"该弹窗首次展示联盟初始段位，并非发生降级。当前标题会让玩家误以为被处罚。","kind":"error","priority":"必改","check":"","usage":"玩家展示","highlights":["掉段"],"replacements":[{"sheet":"2.一级界面","cell":"O2390","original":"掉段","text":"初始段位"}],"handling":false},{"id":"peak-08","scope":"interface","group":"介绍与说明","title":"报名失败降级不能固定写白银","sheet":"2.一级界面","location":"O2448","original": sheet":"文案需求","cell":"B60","text":"黄金"},{"sheet":"文案需求","cell":"B61","text":"钻石"},{"sheet":"文案需求","cell":"B62","text":"王者"}],"proposal":"优先方案：巅峰盟战沿用“黑铁 → 青铜 → 白银 → 黄金”，保持同名段位层级一致。赛事规格感由专属金鹰徽章、巅峰榜、王帐及稀缺奖励体现。\n采用后，按四档位置同步现有段位名称：白银→黑铁、黄金→青铜、钻石→白银、王者→黄金；逐项核对初始分段、晋级表、榜单门槛、成就、保级计数、剧情与配置显示，不直接全局替换。\n备选方案：保留“白银 → 黄金 → 钻石 → 王者”，在跨活动展示时增加“巅峰·”前缀，并使用独立徽章。\n两种方案均须说明赛事独立分段，普通盟战段位不直接继承，也不作等值换算。","reason":"黄金在普通盟战为最高档，在巅峰盟战为第二档；白银从普通第三档变成巅峰最低档。玩家沿用旧认知时可能误以为被降段。新体系能传递更高规格，但需要通过名称归属、独立徽章和首次分段解释共同消除歧义。","kind":"ambiguity","priority":"可选","usage":"内部命名与UI包装","highlights":[],"replacements":[],"handling":true,"check":"巅峰盟战是否沿用普通盟战名称，由系统与UI确认。采用后同步全部展示及对应配置，内部KEY不因名称调整而直接修改。"},{"id":"peak-26","scope":"interface","group":"介绍与说明","title":"首次分段说明独立体系，避免理解为旧段位降级","sheet":"2.一级界面","location":"O2400","original":"O2400：根据报名成员上赛季盟战综合表现及联盟组队情况，自动分配初始段位","originals":[{"sheet":"2.一级界面","cell":"O2400","text":"根据报名成员上赛季盟战综合表现及联盟组队情况，自动分配初始段位"}],"proposal":"巅峰盟战采用独立段位，根据报名成员综合实力、上赛季盟战表现及联盟组队情况，重新分配初始段位。","reason":"原句没有解释普通盟战与巅峰盟战是两套段位体系，且只说上赛季表现，未清楚覆盖当前勇士战力因素。补充独立段位与综合实力，让首次结果被理解为新赛事分段；不暗示普通黄金与巅峰某段位等值。","kind":"ambiguity","priority":"建议修改","usage":"玩家展示","highlights":[],"replacements":[{"sheet":"2.一级界面","cell":"O2400","original":"根据报名成员上赛季盟战综合表现及联盟组队情况，自动分配初始段位","text":"巅峰盟战采用独立段位，根据报名成员综合实力、上赛季盟战表现及联盟组队情况，重新分配初始段位。","shortText":"巅峰盟战采用独立段位，按实力、历史表现及组队情况重新分段。","shortCondition":"仅在原有说明控件空间不足时使用；具体分段规则继续由现有详情说明承接。"}],"handling":false,"check":"当前方案的组队联盟与赛季中首次报名均从最低段位起步；若采用统一命名，最低档应同步为黑铁。此处仅调整名称与说明，不改变初始分段逻辑。"},{"id":"peak-27","scope":"interface","group":"介绍与说明","title":"主规则沿用原排版，仅补必要条件与修正错词","sheet":"5.相关系统","location":"S19","original":"巅峰盟战赛季\n●每个赛季共4场比赛，每场比赛持续一周，包含报名期、设置期、匹配期、比赛期、领奖期\n\n【报名期】\n● 个人报名：已加入联盟的可汗，且拥有9名等级≥60级的勇士  \n　即可在报名期手动报名参加联盟争霸  \n● 联盟报名：联盟内个人报名成功的可汗数量超过5名，则该联盟  \n　自动报名成功  \n● 联盟报名成功后将激活“团结光环”增益，报名人数越多，增益  \n效果越强  \n● 联盟报名成功后，个人报名成功的可汗才可参战  \n● 每场比赛都需要各自单独报名\n\n【设置期】\n● 赛季首场设置期间，盟主/副盟主可选择是否开启组队盟战和设置屏蔽联盟，后续不可修改\n\n【匹配期】\n● 每6个联盟为1个小组（余数不足6个时，将尽量保持各组联盟数量平均）；\n●  首场比赛，将根据各个参战联盟的“参战成员总国力和上 <script>'use strict';
const base=JSON.parse(document.getElementById('review-data').textContent);
const labels={error:'明确错误',ambiguity:'概念歧义',polish:'表达优化'};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const projects=base.projects;
let activeId=projects[0]?.id,kind='all',tab='interface',query='';
const groups={interface:['介绍与说明','培养操作','属性与术语','需系统确认'],direction:['主题命名','概念关系','核心体验'],story:['引导配置','剧情引导']};
function project(){return projects.find(p=>p.id===activeId)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),2200)}
async function copy(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const el=document.createElement('textarea');el.value=text;el.style.position='fixed';el.style.left='-10000px';document.body.append(el);el.select();const ok=document.execCommand('copy');el.remove();if(!ok)throw Error('copy')}toast('已复制')}catch(e){toast('复制受限，请选中文本手动复制')}}
function rowNum(i){return Math.min(...(i.location.match(/\d+/g)||['0']).map(Number))}
function ordered(items){return [...items].sort((a,b)=>a.sheet.localeCompare(b.sheet,'zh-CN')||rowNum(a)-rowNum(b))}
function scopeItems(p){return(p?.items||[]).filter(i=>i.scope===tab)}
function matches(i){const q=query.trim().toLowerCase();return(kind==='all'||i.kind===kind)&&(!q||[i.title,i.sheet,i.location,i.original,i.proposal,i.reason,i.check,i.group,i.actionNote,i.priority,i.usage,JSON.stringify(i.replacements||[]),JSON.stringify(i.alternatives||[])].join(' ').toLowerCase().includes(q))}

const diffCache=new Map();
function diffText(before,after){
 const key=JSON.stringify([before,after]);if(diffCache.has(key))return diffCache.get(key);
 const a=String(before??'').match(/#[^#\n]+#|[\s\S]/gu)||[],b=String(after??'').match(/#[^#\n]+#|[\s\S]/gu)||[];
 let left='',right='';
 const wrap=(s,type)=>s?'<mark class="diff-'+type+'">'+esc(s)+'</mark>':'';
 if(a.length*b.length>8000000){left=wrap(before,'removed');right=wrap(after,'added')}
 else{
  const cols=b.length+1,dp=new Uint16Array((a.length+1)*cols);
  for(let x=a.length-1;x>=0;x--)for(let y=b.length-1;y>=0;y--)dp[x*cols+y]=a[x]===b[y]?1+dp[(x+1)*cols+y+1]:Math.max(dp[(x+1)*cols+y],dp[x*cols+y+1]);
  let x=0,y=0,removed='',added='';
  const flush=()=>{left+=wrap(removed,'removed');right+=wrap(added,'added');removed='';added=''};
  while(x<a.length||y<b.length){
   if(x<a.length&&y<b.length&&a[x]===b[y]){flush();left+=esc(a[x]);right+=esc(b[y]);x++;y++}
   else if(x<a.length&&(y===b.length||dp[(x+1)*cols+y]>=dp[x*cols+y+1]))removed+=a[x++];
   else added+=b[y++];
  }flush();
 }
 const result={before:left,after:right};if(diffCache.size>100)diffCache.clear();diffCache.set(key,result);return result;
}
function diffOriginal(i){
 if(i.replacements?.length)return i.replacements.map(r=>'<div class="replacement-head"><span class="cell">'+esc(r.cell)+'</span></div><div class="copytext">'+diffText(r.original,r.text).before+'</div>').join('');
 return diffText(i.originals?.length===1?i.originals[0].text:i.original,i.proposal).before;
}

function highlighted(i){
 if(i.showDiff)return diffOriginal(i);
 if(i.kind!=='error')return esc(i.original);
 return i.original.split('\n').map(line=>{
  let words=i.highlights||[];
  if(i.id==='astra-24')words=/^[KO]987/.test(line)?['图腾加成']:['图腾加成','#n1#'];
  if(i.id==='astra-31')words=line.startsWith('D30')?[]:words;
  const terms=[...new Set(words)].filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!terms.length)return esc(line);
  const re=new RegExp(terms.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  let out='',at=0;for(const m of line.matchAll(re)){out+=esc(line.slice(at,m.index))+'<mark class="error-word">'+esc(m[0])+'</mark>';at=m.index+m[0].length}return out+esc(line.slice(at));
 }).join('\n');
}
function render(){const p=project();$('projectName').textContent=p?.name||'文案包装校对';document.title=(p?.name?p.name+' · ':'')+'GOK文案包装校对';document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});$('reviewPanel').classList.remove('hidden');$('draftsPanel').classList.add('hidden');$('storyPanel').classList.toggle('hidden',tab!=='story');renderReviews(p);renderStory(p)}



function decisionBlocks(i){
 const a=i.analysis;
 return '<div class="decision-summary">'+esc(a.summary)+'</div>'+
 '<div class="decision-example"><table><thead><tr>'+a.headers.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+a.rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table><p class="decision-caption">'+esc(a.caption)+'</p></div>'+
 '<div class="decision-action"><div class="decision-label">处理建议</div><p>'+esc(a.recommendation)+'</p></div>'+
 (a.reference?'<details class="decision-reference"><summary>排序表述参考 · 待确认</summary><p class="decision-caption">'+esc(a.reference.condition)+'</p><div class="copytext">'+esc(a.reference.text)+'</div></details>':'');
}

function replacementBlocks(i){
 if(i.analysis)return decisionBlocks(i);
 const block=(r,index,alt)=>{
  const attrs=`data-copy-replacement="${esc(i.id)}" data-replacement-index="${index}" ${alt===undefined?'':`data-alternative-index="${alt}"`}`;
  const cross=r.sheet&&r.sheet!==i.sheet;
  return `<div class="replacement"><div class="replacement-head"><span>${cross?`<small class="replacement-sheet">${esc(r.sheet)}</small>`:''}<span class="cell">${esc(r.cell)}</span></span><button class="copy" ${attrs}>复制此单元格</button></div><div class="copytext">${i.showDiff?diffText(r.original,r.text).after:esc(r.text)}</div>${r.shortText?`<details class="short-option"><summary>空间受限时的精简稿</summary><p>${esc(r.shortCondition)}</p><div class="copytext">${esc(r.shortText)}</div><button class="copy" ${attrs} data-short="true">复制精简稿</button></details>`:''}</div>`;
 };
 let out=(i.replacements||[]).map((r,index)=>block(r,index)).join('');
 if(i.alternatives?.length)out+=`<div class="conditional-title">由系统确认规则后，统一采用一套文本</div>`+i.alternatives.map((a,ai)=>`<details class="alternative"><summary>${esc(a.title)}</summary><p class="condition">${esc(a.condition)}</p>${a.replacements.map((r,ri)=>block(r,ri,ai)).join('')}</details>`).join('');
 if(!out)out=`<div class="copytext">${i.showDiff?diffText(i.originals?.length===1?i.originals[0].text:i.original,i.proposal).after:esc(i.proposal)}</div>`;
 return out;
}
function priorityBadge(value){return `<span class="action-priority ${value==='必改'?'required':value==='确认后修改'?'confirm':value==='建议修改'?'suggested':'optional'}">${esc(value||'可选')}</span>`}
function card(i){
 const hasCells=i.replacements?.length||i.alternatives?.length;
 return `<article class="review ${esc(i.kind)} ${i.priority==='可选'?'optional-review':''}"><div class="cardhead"><div><div class="titleline"><span class="badge">${labels[i.kind]}</span><h3>${esc(i.title)}</h3>${priorityBadge(i.priority)}</div><div class="loc">${esc(i.sheet)}<span class="cell">${esc(i.location)}</span><span class="usage">适用：${esc(i.usage||'内部设计说明')}</span></div></div>${hasCells?'':`<button class="copy" data-copy-item="${esc(i.id)}">复制处理方案</button>`}</div>${i.showDiff?'<div class="diff-legend"><span>红色删除线：原文删改</span><span>绿色底色：建议新增或改写</span><span>未标色：保留内容</span></div>':''}<div class="comparison"><div class="col original"><div class="label">原文</div><div class="copytext">${highlighted(i)}</div></div><div class="col proposal"><div class="label">${i.handling&&!hasCells?'处理方案':'建议文本'}</div>${replacementBlocks(i)}${i.lengthNote?`<div class="length-note">${esc(i.lengthNote)}</div>`:''}</div></div><div class="reason"><strong>修改理由</strong>${esc(i.reason)}${i.actionNote?`<div class="actionnote">${esc(i.actionNote)}</div>`:''}</div>${i.check?`<div class="pending"><b>待确认</b>　${esc(i.check)}</div>`:''}</article>`
}
function renderReviews(p){
 const all=scopeItems(p);
 const categories=[['all','全部'],...Object.entries(labels)].filter(([k])=>k==='all'?all.length>0:all.some(i=>i.kind===k));
 if(kind!=='all'&&!categories.some(([k])=>k===kind))kind='all';
 const rows=all.filter(matches);
 $('filters').innerHTML=categories.map(([k,l])=>`<button class="chip ${kind===k?'active':''}" data-kind="${k}" aria-pressed="${kind===k}">${l}<span class="count">${k==='all'?all.length:all.filter(i=>i.kind===k).length}</span></button>`).join('');
 $('resultCount').textContent=`${rows.length} / ${all.length} 条建议`;
 const cards=tab==='story'?rows.filter(i=>i.group==='引导配置'):rows;
 const names=[...new Set([...(groups[tab]||[]),...cards.map(i=>i.group)])];
 $('cards').innerHTML=names.map(name=>{const items=ordered(cards.filter(i=>i.group===name));return items.length?`<section aria-label="${esc(name)}"><h2 class="grouphead">${esc(name)}<small>${items.length} 条</small></h2>${items.map(card).join('')}</section>`:''}).join('');
 if(!rows.length)$('cards').innerHTML='<div class="empty"><strong>没有匹配的建议</strong>试试其他关键词或问题类别。</div>';
}
function narrativeIssue(p,line){return(p?.items||[]).filter(i=>(line.reviewIds||[]).includes(i.id))}
function visibleStory(p,line){
 const issues=narrativeIssue(p,line);
 if(kind==='all'&&!query.trim())return true;
 if(issues.some(matches))return true;
 if(kind!=='all'&&!issues.some(i=>i.kind===kind))return false;
 const q=query.trim().toLowerCase();return Boolean(q)&&[line.location,line.speaker,line.originalSpeaker,line.original,line.text].join(' ').toLowerCase().includes(q);
}
function renderStory(p){
 if(tab!=='story'){ $('storyPanel').innerHTML='';return }
 const story=p?.story||[],rows=story.filter(s=>visibleStory(p,s));
 if(!story.length){$('storyPanel').innerHTML='';return}
 const body=rows.map(s=>{
  const issues=narrativeIssue(p,s);const severity=issues.some(i=>i.kind==='error')?'error':issues.some(i=>i.kind==='ambiguity')?'ambiguity':'polish';
  const role=s.originalSpeaker!==s.speaker?`<mark class="error-word">${esc(s.originalSpeaker)}</mark>`:esc(s.originalSpeaker);
  return `<div class="narrative-line ${severity}"><div class="line-meta"><span class="cell">${esc(s.location)}</span>${issues.length?`<span class="badge">${labels[severity]}</span>${priorityBadge(issues.some(i=>i.priority==='必改')?'必改':issues.some(i=>i.priority==='确认后修改')?'确认后修改':'可选')}`:'<span class="unchanged">保留</span>'}</div><div class="line-source"><div class="line-title">原文</div><div class="line-role">${role}</div>${esc(s.original)}</div><div class="line-proposal"><div class="line-title">建议稿</div><div class="line-role">${esc(s.speaker)}</div>${esc(s.text)}${s.changed?`<button class="copy" data-copy-line="${esc(s.location)}">复制建议句</button>`:''}</div>${issues.length?`<div class="line-reason"><b>修改理由：</b>${issues.map(i=>esc(i.reason)+(i.check?`<br><b>待确认：</b>${esc(i.check)}`:'')).join('<br>')}${s.contextNote?`<div class="context-note"><b>衔接检查：</b>${esc(s.contextNote)}</div>`:''}</div>`:''}</div>`;
 }).join('');
 $('storyPanel').innerHTML=(rows.length?`<div class="story-heading"><h2>剧情逐句对照<small>${rows.length} 句</small></h2><button class="copy" id="copyStory">复制保守修正版</button></div><div class="narrative"><div class="narrative-head"><span>位置</span><span>原文 / 发言角色</span><span>建议稿 / 发言角色</span></div>${body}</div>`:'')+`<details class="draft"><summary>保守修正版 · 仅修必改项</summary><p class="rationale">${esc(p.storyConservativeNote||'仅修正明确错误，保留可选对白原文。')}</p><div class="finaltext">${(p.storyConservative||story).map(s=>esc(s.speaker)+'：'+esc(s.text)).join('\n\n')}</div></details><details class="draft"><summary>润色参考版 · 包含可选调整</summary><p class="rationale">${esc(p.storyPolishNote||'仅作润色参考，非默认定稿。')}</p><button class="copy" id="copyStoryPolish">复制润色参考版</button><div class="finaltext">${story.map(s=>esc(s.speaker)+'：'+esc(s.text)).join('\n\n')}</div></details>`;
}
$('projectSelect').innerHTML=projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.type)}</option>`).join('');
$('projectSelect').addEventListener('change',e=>{activeId=e.target.value;query='';$('search').value='';kind='all';render()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;kind='all';query='';$('search').value='';render()}});
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(b){kind=b.dataset.kind;renderReviews(project());renderStory(project())}});
$('search').addEventListener('input',e=>{query=e.target.value;renderReviews(project());renderStory(project())});
$('cards').addEventListener('click',e=>{
 const cellButton=e.target.closest('[data-copy-replacement]');
 if(cellButton){const i=project()?.items.find(x=>x.id===cellButton.dataset.copyReplacement);const ai=cellButton.dataset.alternativeIndex;const list=ai===undefined?i?.replacements:i?.alternatives?.[Number(ai)]?.replacements;const r=list?.[Number(cellButton.dataset.replacementIndex)];if(r)copy(cellButton.dataset.short?r.shortText:r.text);return}
 const b=e.target.closest('[data-copy-item]');if(b){const i=project()?.items.find(x=>x.id===b.dataset.copyItem);if(i)copy(i.proposal)}
});
$('storyPanel').addEventListener('click',e=>{if(e.target.closest('#copyStory'))copy((project().storyConservative||project().story).map(s=>s.speaker+'：'+s.text).join('\n\n'));if(e.target.closest('#copyStoryPolish'))copy(project().story.map(s=>s.speaker+'：'+s.text).join('\n\n'));const b=e.target.closest('[data-copy-line]');if(b){const line=project()?.story.find(s=>s.location===b.dataset.copyLine);if(line)copy(line.text)}});
render();
</script>
</body></html>
